<title>Shared Hypotheekcijfer</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#13203b;--muted:#5d6680;--line:#e1e5ef;--brand:#1d3a8a;--brand-2:#e8eefb;--accent:#ff6a3d;--accent-2:#fff0ea;
--goed:#17824f;--goed-bg:#e2f4ea;--let:#5f7417;--let-bg:#eef4d9;--krap:#a96400;--krap-bg:#fdefd8;--risico:#bf2f24;--risico-bg:#fbe4e1;--shadow:0 1px 2px rgba(19,32,59,.06),0 4px 14px rgba(19,32,59,.05)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1424;--card:#161e33;--ink:#e7ebf5;--muted:#9aa4bd;--line:#29324b;--brand:#8fb0ff;--brand-2:#1d2847;--accent:#ff8a63;--accent-2:#3a2219;
--goed:#58c98f;--goed-bg:#163626;--let:#b9cf63;--let-bg:#2a331a;--krap:#f0a845;--krap-bg:#3a2b12;--risico:#ff7a6e;--risico-bg:#3d1b18;--shadow:none}}
:root[data-theme="dark"]{--bg:#0e1424;--card:#161e33;--ink:#e7ebf5;--muted:#9aa4bd;--line:#29324b;--brand:#8fb0ff;--brand-2:#1d2847;--accent:#ff8a63;--accent-2:#3a2219;
--goed:#58c98f;--goed-bg:#163626;--let:#b9cf63;--let-bg:#2a331a;--krap:#f0a845;--krap-bg:#3a2b12;--risico:#ff7a6e;--risico-bg:#3d1b18;--shadow:none}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
header{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.wrap{max-width:1240px;margin:0 auto;padding:0 16px}
.top{display:flex;align-items:center;gap:16px;padding:12px 0;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px}
.logo i{width:30px;height:30px;border-radius:8px;background:var(--brand);display:grid;place-items:center;color:#fff;font-style:normal;font-size:15px}
.logo small{display:block;font-weight:500;font-size:12px;color:var(--muted)}
nav{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
nav button{border:0;background:none;color:var(--muted);padding:8px 12px;border-radius:8px;font:inherit;font-weight:600;cursor:pointer}

main{padding:20px 0 60px}
h1{font-size:22px;margin:0 0 4px}h2{font-size:16px;margin:0 0 12px}h3{font-size:14px;margin:0 0 8px}
.sub{color:var(--muted);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow)}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.kpi .v{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}.kpi .l{color:var(--muted);font-size:12px}.kpi .h{font-size:12px;color:var(--muted);margin-top:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sp{flex:1}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 12px;border-radius:8px;font:inherit;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--brand)}

select,input{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-width:0}
input:focus,select:focus{outline:2px solid var(--brand);outline-offset:-1px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600}
label.f input,label.f select{width:100%;font-weight:400}
.fg{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px 12px}
.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.tbl th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);padding:8px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
.tbl td{white-space:nowrap;padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr.click{cursor:pointer}.tbl tr.click:hover td{background:var(--brand-2)}
.tbl .r{text-align:right}
.scroll{overflow-x:auto}
.b{display:inline-block;padding:2px 7px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap}
.goed{background:var(--goed-bg);color:var(--goed)}.let{background:var(--let-bg);color:var(--let)}.krap{background:var(--krap-bg);color:var(--krap)}.risico{background:var(--risico-bg);color:var(--risico)}
.neu{background:var(--brand-2);color:var(--brand)}.ghost{background:transparent;border:1px dashed var(--line);color:var(--muted)}
.c{display:inline-grid;place-items:center;min-width:36px;height:24px;border-radius:6px;font-weight:700;font-size:13px;padding:0 6px}
.c.vl{opacity:.75;border:1px dashed currentColor}
.two{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:16px;align-items:start}
@media(max-width:960px){.two{grid-template-columns:1fr}}
.sticky{position:sticky;top:74px}
@media(max-width:960px){.sticky{position:static}}
.big{display:flex;gap:16px;align-items:center}
.ring{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;font-size:32px;font-weight:800;flex:none}
.sc{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.s{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--card)}
.s .t{font-weight:700;font-size:13px}.s .w{font-size:12px;color:var(--muted)}
.s .n{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:6px}
.s .hp{font-size:12px;margin-top:6px;padding-top:6px;border-top:1px dashed var(--line)}
.sig{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-bottom:1px dashed var(--line);font-size:13px}.sig:last-child{border:0}
.note{font-size:12px;color:var(--muted)}
.warn{background:var(--accent-2);border-left:3px solid var(--accent);padding:10px 12px;border-radius:6px;font-size:13px}
.flag{background:var(--krap-bg);border-left:3px solid var(--krap);padding:10px 12px;border-radius:6px;font-size:13px;margin:8px 0}
.flag b{color:var(--krap)}
.sect{margin-top:16px;padding-top:12px;border-top:1px solid var(--line)}
.sect:first-child{margin-top:0;padding-top:0;border:0}
details summary{cursor:pointer;font-weight:700}
.tl{position:relative;height:56px;margin:8px 4px 0}
.tl .ax{position:absolute;left:0;right:0;top:26px;height:2px;background:var(--line)}
.tl .m{position:absolute;top:18px;transform:translateX(-50%);text-align:center;font-size:10px;color:var(--muted);white-space:nowrap}
.tl .m i{display:block;width:14px;height:14px;border-radius:50%;margin:0 auto 4px;border:2px solid var(--card)}
.tl .y{position:absolute;top:36px;font-size:10px;color:var(--muted);transform:translateX(-50%)}
.flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.flow div{border:1px solid var(--line);border-radius:10px;padding:10px;font-size:12px;background:var(--card)}
.flow b{display:block;font-size:13px;color:var(--brand)}
.muted{color:var(--muted)}
.hide{display:none!important}
footer{color:var(--muted);font-size:12px;padding:20px 0;border-top:1px solid var(--line)}
</style>

<body>
<header><div class="wrap top">
  <div class="logo"><i>H</i><div>Shared Hypotheekcijfer<small>Structurele hypotheekmonitoring · geldverstrekker · adviseur · klant</small></div></div>
  <nav id="nav">
    <button data-v="gv" class="on">Geldverstrekker</button>
    <button data-v="adv">Adviseur</button>
    <button data-v="klant">Hypotheekcijfer</button>
    <button data-v="kader">Kader &amp; compliance</button>
  </nav>
</div></header>
<main class="wrap" id="app"></main>
<footer class="wrap">Indicatieve monitoringtool — geen hypotheekadvies, geen leennormtoets en geen taxatie. Demo-portefeuille is fictief. Gegevens blijven in het geheugen van deze pagina (geen opslag, geen externe API's).</footer>

<script>
/* Rekenkern Shared Hypotheekcijfer — indicatief, geen advies of leennormtoets.
   Alle parameters staan in PARAMS zodat ze jaarlijks bij te werken zijn. */
const PARAMS = {
  jaar: 2026,
  aftrekTarief: 0.3756,      // max. tarief hypotheekrenteaftrek 2026 (parameter)
  ewfPct: 0.0035,            // eigenwoningforfait (WOZ 75k–1,33 mln)
  aowLeeftijd: 67,           // vereenvoudigd
  wwPct: 0.70,               // WW na 2 maanden
  wwMaxJaar: 79000,          // indicatief maximum dagloon x 261 (parameter)
  aoPct: 0.70,               // indicatief WIA/WGA-niveau
  pensioenPctDefault: 0.70,
  renteHerfinDefault: 4.2,
  // Indicatieve woonquote-benadering (bruto woonlast / bruto inkomen) per inkomensniveau.
  woonquote: [[20000, .16], [30000, .19], [40000, .22], [60000, .255], [80000, .28], [100000, .30], [150000, .32], [250000, .33]],
  funderingHerstel: { laag: 0, middel: 25000, hoog: 75000 }, // indicatieve stress-aftrek (parameter)
  // Onderhoudsscenario's (zelfde schaal als PandWise); prudente waardecorrectie
  onderhoudCorrectie: { uitstekend: 0, goed: 0, redelijk: -0.02, matig: -0.06, slecht: -0.12 }
};

function interp(table, x) {
  if (x <= table[0][0]) return table[0][1];
  for (let i = 1; i < table.length; i++) {
    if (x <= table[i][0]) {
      const [x0, y0] = table[i - 1], [x1, y1] = table[i];
      return y0 + (y1 - y0) * (x - x0) / (x1 - x0);
    }
  }
  return table[table.length - 1][1];
}

function annuiteit(schuld, rentePct, maanden) {
  if (schuld <= 0 || maanden <= 0) return 0;
  const r = rentePct / 100 / 12;
  if (r === 0) return schuld / maanden;
  return schuld * r / (1 - Math.pow(1 + r, -maanden));
}

/* Maandlast van één leningdeel op een gegeven moment. */
function deelLast(d, rentePct, restMaanden) {
  const schuld = d.saldo;
  const rente = schuld * rentePct / 100 / 12;
  let aflossing = 0;
  if (d.vorm === 'annuitair') aflossing = annuiteit(schuld, rentePct, restMaanden) - rente;
  else if (d.vorm === 'lineair') aflossing = restMaanden > 0 ? schuld / restMaanden : 0;
  return { rente, aflossing, bruto: rente + aflossing };
}

/* Saldo-projectie van een deel na n maanden (bij huidige rente). */
function projecteerSaldo(d, n) {
  let s = d.saldo; const r = d.rente / 100 / 12; let rest = d.restLooptijd;
  for (let i = 0; i < n && rest > 0; i++, rest--) {
    if (d.vorm === 'annuitair') { const a = annuiteit(s, d.rente, rest); s -= (a - s * r); }
    else if (d.vorm === 'lineair') s -= s / rest;
  }
  return Math.max(0, s);
}

function score(woonlastJaar, inkomenJaar) {
  if (inkomenJaar <= 0) return { cijfer: 1, ratio: Infinity, norm: 0 };
  const norm = interp(PARAMS.woonquote, inkomenJaar);
  const ratio = (woonlastJaar / inkomenJaar) / norm; // 1,0 = precies op de indicatieve norm
  // 0,6 → 10 ; 1,0 → 6 ; 1,3 → 3,5 ; ≥1,7 → 1
  const pts = [[0.6, 10], [1.0, 6], [1.3, 3.5], [1.7, 1]];
  let c = ratio <= .6 ? 10 : interp(pts, ratio);
  return { cijfer: Math.round(Math.max(1, Math.min(10, c)) * 10) / 10, ratio, norm };
}

function leeftijdOp(geboortejaar, jaar) { return jaar - geboortejaar; }

/* Bereken alle scenario's voor één dossier. */
function berekenDossier(k) {
  const jaar = PARAMS.jaar;
  const ink1 = +k.inkomen1 || 0, ink2 = k.partner ? (+k.inkomen2 || 0) : 0;
  const pens1 = k.pensioen1 != null && k.pensioen1 !== '' ? +k.pensioen1 : ink1 * PARAMS.pensioenPctDefault;
  const pens2 = k.partner ? (k.pensioen2 != null && k.pensioen2 !== '' ? +k.pensioen2 : ink2 * PARAMS.pensioenPctDefault) : 0;
  const delen = k.delen || [];
  const schuld = delen.reduce((s, d) => s + d.saldo, 0);
  const woz = +k.woz || +k.waarde || 0;
  const aftrekActief = d => d.aftrekEindJaar ? d.aftrekEindJaar > jaar : true;

  function maandlast(opts) {
    // opts: {rente: override%|null, aftrek: bool|null(per deel), jarenVooruit}
    let bruto = 0, rente = 0, aftrekbareRente = 0;
    const n = (opts.jarenVooruit || 0) * 12;
    delen.forEach(d => {
      const saldo = n ? projecteerSaldo(d, n) : d.saldo;
      const rest = Math.max(1, d.restLooptijd - n);
      const r = opts.rente != null ? opts.rente : d.rente;
      const l = deelLast({ ...d, saldo }, r, rest);
      bruto += l.bruto; rente += l.rente;
      const aftrek = opts.aftrek === false ? false : (opts.aftrek === true ? true : (d.aftrekEindJaar ? d.aftrekEindJaar > jaar + (opts.jarenVooruit || 0) : true));
      if (aftrek && d.box !== 3) aftrekbareRente += l.rente;
    });
    const ewf = woz * PARAMS.ewfPct / 12;
    const voordeel = Math.max(0, (aftrekbareRente - ewf) * PARAMS.aftrekTarief);
    return { bruto, rente, netto: bruto - voordeel, voordeel };
  }

  const huidigeLast = maandlast({});
  const scen = [];
  const push = (id, titel, wanneer, inkomen, last, toelichting) => {
    const s = score(last.bruto * 12, inkomen);
    scen.push({ id, titel, wanneer, inkomen, bruto: last.bruto, netto: last.netto, ...s, toelichting,
      deltaNetto: last.netto - huidigeLast.netto });
  };

  push('huidig', 'Huidige situatie', 'Nu', ink1 + ink2, huidigeLast, 'Huidig inkomen en huidige rente.');

  // Momenten na het einde van de looptijd tellen niet mee (lening is dan afgelost)
  const eindJaar = jaar + Math.ceil(Math.max(...delen.map(d => d.restLooptijd)) / 12);
  const binnen = y => y < eindJaar ? y : 9999;
  // Renteschok bij einde rentevaste periode
  const rvpJaar = binnen(Math.min(...delen.map(d => d.rvpEindJaar || 9999)));
  const jrRvp = Math.max(0, rvpJaar - jaar);
  const herRente = +k.renteHerfin || PARAMS.renteHerfinDefault;
  if (rvpJaar < 9999) push('rente', 'Einde rentevaste periode', String(rvpJaar), ink1 + ink2,
    maandlast({ rente: herRente, jarenVooruit: jrRvp }), `Herfinanciering tegen ${fmtPct(herRente)} (aanname).`);

  // Aftrekverval
  const aftrekEind = binnen(Math.min(...delen.map(d => d.aftrekEindJaar || 9999)));
  if (aftrekEind < 9999 && aftrekEind <= jaar + 30) {
    const jr = Math.max(0, aftrekEind - jaar);
    push('aftrek', 'Einde hypotheekrenteaftrek', String(aftrekEind), ink1 + ink2,
      maandlast({ aftrek: false, jarenVooruit: jr }), 'De 30-jaarstermijn voor renteaftrek loopt af.');
  }

  // Pensioen (eerste AOW in huishouden)
  const aowJaren = [k.geboortejaar1 + PARAMS.aowLeeftijd];
  if (k.partner && k.geboortejaar2) aowJaren.push(k.geboortejaar2 + PARAMS.aowLeeftijd);
  const aow1 = aowJaren[0], aow2 = aowJaren[1] || 9999;
  const pensJaar = binnen(Math.min(aow1, aow2));
  if (pensJaar >= jaar && pensJaar < 9999) {
    const inkP = (aow1 <= pensJaar ? pens1 : ink1) + (k.partner ? (aow2 <= pensJaar ? pens2 : ink2) : 0);
    push('pensioen', 'Pensionering', String(pensJaar), inkP, maandlast({ jarenVooruit: pensJaar - jaar }),
      'Inkomen daalt naar AOW + pensioen (opgave of 70%-aanname).');
  }

  // Samenloop: binnen 5 jaar van elkaar
  const momenten = [rvpJaar, aftrekEind, pensJaar].filter(x => x < 9999 && x >= jaar);
  let samenloop = null;
  if (momenten.length >= 2) {
    const span = Math.max(...momenten) - Math.min(...momenten);
    if (span <= 5) {
      const peil = Math.max(...momenten);
      const inkS = (aow1 <= peil ? pens1 : ink1) + (k.partner ? (aow2 <= peil ? pens2 : ink2) : 0);
      push('samenloop', 'Samenloop renteschok · aftrek · pensioen', `${Math.min(...momenten)}–${peil}`, inkS,
        maandlast({ rente: rvpJaar <= peil ? herRente : null, aftrek: aftrekEind <= peil ? false : null, jarenVooruit: peil - jaar }),
        `${momenten.length} schokken vallen binnen ${span} jaar samen.`);
      samenloop = { van: Math.min(...momenten), tot: peil, aantal: momenten.length };
    }
  }

  // Einde looptijd: resterende (aflossingsvrije) schuld moet worden afgelost of geherfinancierd
  const restEind = delen.filter(d => d.vorm === 'aflossingsvrij').reduce((s, d) => s + d.saldo, 0);
  if (restEind > 0) {
    const inkE = (aow1 <= eindJaar ? pens1 : ink1) + (k.partner ? (aow2 <= eindJaar ? pens2 : ink2) : 0);
    const r = restEind * herRente / 100 / 12;
    push('looptijd', 'Einde looptijd', String(eindJaar), inkE, { bruto: r, netto: r },
      `${fmtEUR(restEind)} aflossingsvrij resteert; herfinanciering tegen ${fmtPct(herRente)} zonder aftrek.`);
  }

  // Werkloosheid aanvrager 1
  const ww = x => Math.min(x, PARAMS.wwMaxJaar) * PARAMS.wwPct;
  push('ww1', `Werkloosheid ${k.naam1 || 'aanvrager 1'}`, 'Direct', ww(ink1) + ink2, huidigeLast, 'WW 70% van het (gemaximeerde) loon.');
  if (k.partner) push('ww2', `Werkloosheid ${k.naam2 || 'partner'}`, 'Direct', ink1 + ww(ink2), huidigeLast, 'WW 70% van het (gemaximeerde) loon.');
  push('ao1', `Arbeidsongeschiktheid ${k.naam1 || 'aanvrager 1'}`, 'Na 2 jaar ziekte', Math.min(ink1, PARAMS.wwMaxJaar) * PARAMS.aoPct + ink2, huidigeLast,
    'Indicatief 70% van het gemaximeerde loon; zonder AOV/WIA-hiaatverzekering.');

  if (k.partner) {
    const orv1 = +k.orv1 || 0;
    const f1 = schuld > 0 ? Math.max(0, schuld - orv1) / schuld : 1;
    push('overlijden1', `Overlijden ${k.naam1 || 'aanvrager 1'}`, 'Direct', ink2 + (+k.nabestaanden2 || 0),
      { bruto: huidigeLast.bruto * f1, netto: huidigeLast.netto * f1 },
      orv1 ? `ORV-uitkering ${fmtEUR(orv1)} verlaagt de schuld.` : 'Geen overlijdensrisicoverzekering opgegeven.');
    const orv = +k.orv2 || 0; // ORV op leven partner, uitkering verlaagt schuld
    const fact = schuld > 0 ? Math.max(0, schuld - orv) / schuld : 1;
    const l = maandlast({}); const lo = { bruto: l.bruto * fact, netto: l.netto * fact };
    push('overlijden', `Overlijden ${k.naam2 || 'partner'}`, 'Direct', ink1 + (+k.nabestaanden || 0), lo,
      orv ? `ORV-uitkering ${fmtEUR(orv)} verlaagt de schuld.` : 'Geen overlijdensrisicoverzekering opgegeven.');
    push('scheiding', 'Scheiding (blijver neemt hypotheek over)', 'Direct', ink1, huidigeLast, 'Eén inkomen draagt de volledige hypotheek.');
  }

  const daling = +k.inkomensdaling || 20;
  push('daling', `Inkomensdaling ${daling}%`, 'Direct', (ink1 + ink2) * (1 - daling / 100), huidigeLast, 'Bijvoorbeeld minder uren of lager loon.');

  // Onderpand
  const waarde = +k.waarde || 0;
  const fund = funderingsRisico(k);
  const onderhoudCorr = k.onderhoud ? (PARAMS.onderhoudCorrectie[k.onderhoud] || 0) : 0;
  const waardeStress = Math.max(1, waarde * (1 + onderhoudCorr) - PARAMS.funderingHerstel[fund.niveau]);
  const ltv = waarde > 0 ? schuld / waarde : null;
  const ltvStress = waarde > 0 ? schuld / waardeStress : null;

  const MOM = ['rente', 'aftrek', 'pensioen', 'samenloop', 'looptijd'];
  const mom = scen.filter(x => MOM.includes(x.id)), ev = scen.filter(x => x.id !== 'huidig' && !MOM.includes(x.id));
  const minC = a => a.length ? Math.min(...a.map(x => x.cijfer)) : scen[0].cijfer;
  const totaal = Math.round(((scen[0].cijfer + minC(mom) + minC(ev)) / 3) * 10) / 10;
  scen.forEach(x => x.groep = x.id === 'huidig' ? 'nu' : MOM.includes(x.id) ? 'moment' : 'event');
  const laagste = scen.reduce((m, s) => s.cijfer < m.cijfer ? s : m, scen[0]);
  return { totaal, scen, huidigeLast, schuld, ltv, ltvStress, waardeStress, fund, onderhoudCorr, samenloop, laagste,
    signalen: signalen({ scen, ltv, ltvStress, fund, samenloop, k }) };
}

/* Indicatief funderingscijfer 1–10 (hoger = beter), zelfde indicatoren als Funderingscijfer.nl/PandWise.
   Is er een extern cijfer ingevoerd, dan wint dat. */
function funderingsRisico(k) {
  const r = [];
  if (k.funderingExtern) {
    const c = Math.max(1, Math.min(10, +k.funderingExtern));
    return { cijfer: c, niveau: c <= 4 ? 'hoog' : c <= 6.5 ? 'middel' : 'laag', redenen: ['extern funderingscijfer ingevoerd'], bron: 'extern' };
  }
  let p = 0; const bj = +k.bouwjaar || 0;
  if (bj && bj < 1925) { p += 3; r.push('bouwjaar vóór 1925'); }
  else if (bj && bj < 1970) { p += 2; r.push('bouwjaar 1925–1970'); }
  if (k.grond === 'veen') { p += 2; r.push('veengrond'); } else if (k.grond === 'klei') { p += 1; r.push('kleigrond'); }
  if (k.aandachtsgebied === 'ja') { p += 2; r.push('RVO-aandachtsgebied funderingsproblematiek'); }
  if (k.grondwater === 'ja') { p += 1; r.push('lage/dalende grondwaterstand'); }
  if (k.fundering === 'hout') { p += 2; r.push('houten palen'); } else if (k.fundering === 'staal') { p += 1; r.push('fundering op staal'); }
  if (k.schade === 'ja') { p += 3; r.push('zichtbare scheurvorming/scheefstand'); }
  const c = Math.round(Math.max(1, 10 - p * 0.75) * 10) / 10;
  return { cijfer: c, niveau: c <= 4 ? 'hoog' : c <= 6.5 ? 'middel' : 'laag', redenen: r, bron: 'indicatief' };
}

function signalen({ scen, ltv, ltvStress, fund, samenloop, k }) {
  const s = [];
  // Momenten (zeker in de tijd) wegen zwaarder dan life events (onzeker)
  const MOM = ['rente', 'aftrek', 'pensioen', 'samenloop', 'looptijd'];
  const minMom = Math.min(10, ...scen.filter(x => x.id === 'huidig' || MOM.includes(x.id)).map(x => x.cijfer));
  const minEv = Math.min(10, ...scen.filter(x => x.id !== 'huidig' && !MOM.includes(x.id)).map(x => x.cijfer));
  if (minMom < 4) s.push({ ernst: 'hoog', code: 'EWI-BET', tekst: 'Betaalbaarheid op een toekomstig moment onvoldoende (cijfer < 4).' });
  else if (minMom < 5.5) s.push({ ernst: 'middel', code: 'EWI-BET', tekst: 'Betaalbaarheid op een toekomstig moment krap (cijfer < 5,5).' });
  else if (minEv < 4) s.push({ ernst: 'middel', code: 'EWI-BET', tekst: 'Kwetsbaar bij een life event (cijfer < 4): controleer dekking/buffer.' });
  if (samenloop) s.push({ ernst: 'hoog', code: 'EWI-SAM', tekst: `Samenloop van ${samenloop.aantal} schokken tussen ${samenloop.van} en ${samenloop.tot}.` });
  if (ltv != null && ltv > 1) s.push({ ernst: 'hoog', code: 'EWI-LTV', tekst: `LTV ${fmtPct(ltv * 100, 0)}: onderpand dekt de schuld niet volledig.` });
  else if (ltvStress != null && ltvStress > 1) s.push({ ernst: 'middel', code: 'EWI-LTV', tekst: `Stress-LTV ${fmtPct(ltvStress * 100, 0)} na fundering/onderhoud-correctie.` });
  if (fund.niveau === 'hoog') s.push({ ernst: 'hoog', code: 'EWI-FUN', tekst: 'Verhoogd funderingsrisico: nader onderzoek aanbevolen.' });
  else if (fund.niveau === 'middel') s.push({ ernst: 'middel', code: 'EWI-FUN', tekst: 'Funderingsrisico-indicatoren aanwezig.' });
  if (k.waardeDatum) {
    const jr = PARAMS.jaar - +String(k.waardeDatum).slice(0, 4);
    if (jr >= 3) s.push({ ernst: 'middel', code: 'EWI-VAL', tekst: `Laatste waardebepaling ${jr} jaar oud.` });
  }
  return s;
}

function handelingsperspectief(sc, k, res) {
  const t = [];
  switch (sc.id) {
    case 'rente': t.push('Bespreek tijdig (12–24 maanden vooraf) renteverlenging, rentemiddeling of extra aflossen vóór de rentevaste periode afloopt.'); break;
    case 'aftrek': t.push('Overweeg extra aflossen of het omzetten naar een aflossingsvrij deel in box 3; reken het netto effect van het aftrekverval door.'); break;
    case 'pensioen': t.push('Vraag een pensioenoverzicht op (mijnpensioenoverzicht.nl) en toets of aflossen vóór pensioen of een lagere hypotheek nodig is.'); break;
    case 'samenloop': t.push('Plan een integraal adviesgesprek: de schokken versterken elkaar. Maak een aflosplan en stem rentevast op pensioendatum af.'); break;
    case 'ww1': case 'ww2': t.push('Bouw een buffer op van minimaal 3–6 netto maandlasten en overweeg een woonlastenverzekering.'); break;
    case 'looptijd': t.push('Maak een aflosplan voor het aflossingsvrije deel of bespreek tijdig verlengen/oversluiten; let op uw leeftijd en inkomen op dat moment.'); break;
    case 'ao1': t.push('Controleer het WIA-hiaat via de werkgever; overweeg een AOV of woonlastenverzekering.'); break;
    case 'overlijden1': case 'overlijden': t.push('Toets of de overlijdensrisicodekking (ORV) en het nabestaandenpensioen toereikend zijn.'); break;
    case 'scheiding': t.push('Bespreek wat er gebeurt bij uit elkaar gaan: overname, verkoop of hoofdelijke aansprakelijkheid.'); break;
    case 'daling': t.push('Breng uw vaste lasten in kaart en bespreek mogelijkheden zoals een langere looptijd of rentemiddeling.'); break;
    default: t.push('Geen directe actie nodig; blijf uw situatie periodiek monitoren.');
  }
  return t;
}

function kleur(c) { return c >= 7 ? 'goed' : c >= 5.5 ? 'let' : c >= 4 ? 'krap' : 'risico'; }
function label(c) { return c >= 7 ? 'Ruim betaalbaar' : c >= 5.5 ? 'Betaalbaar' : c >= 4 ? 'Krap' : 'Onvoldoende'; }

const nfEUR = new Intl.NumberFormat('nl-NL', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 });
function fmtEUR(x) { return isFinite(x) ? nfEUR.format(Math.round(x)) : '–'; }
function fmtPct(x, d = 2) { return isFinite(x) ? x.toLocaleString('nl-NL', { minimumFractionDigits: d, maximumFractionDigits: d }) + '%' : '–'; }
function fmtNum(x, d = 1) { return isFinite(x) ? x.toLocaleString('nl-NL', { minimumFractionDigits: d, maximumFractionDigits: d }) : '–'; }

if (typeof module !== 'undefined') module.exports = { PARAMS, berekenDossier, annuiteit, score, funderingsRisico, fmtEUR };

</script>
<script>
/* ================= Applicatie ================= */
const TODAY = new Date();
const ISO = d => d.toISOString().slice(0, 10);
const nlDate = s => s ? new Date(s).toLocaleDateString('nl-NL', { day: 'numeric', month: 'short', year: 'numeric' }) : '–';
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const parseNum = v => { if (typeof v === 'number') return v; const s = String(v || '').replace(/\s|€/g, '').replace(/\./g, '').replace(',', '.'); const n = parseFloat(s); return isFinite(n) ? n : 0; };
const fmtInt = n => Math.round(n || 0).toLocaleString('nl-NL');
const STATUS = { niet: 'Niet gestart', uitgenodigd: 'Uitgenodigd', behandeling: 'In behandeling', afgerond: 'Afgerond', herhaling: 'Herhaling vereist' };
const STATUS_B = { niet: 'ghost', uitgenodigd: 'neu', behandeling: 'let', afgerond: 'goed', herhaling: 'krap' };

const S = {
  view: 'gv', gv: 'Voorbeeldbank Hypotheken N.V.', cyclus: 4,
  portfolio: [], adviseurs: [], filter: { q: '', status: '', signaal: '', adviseur: '' }, sort: { k: 'prio', d: -1 },
  adv: '', cur: null /* {id|null, k, adviseur} */
};

/* ---------- Demo-portefeuille (fictief, deterministisch) ---------- */
function rng(seed) { return () => (seed = (seed * 1664525 + 1013904223) % 4294967296) / 4294967296; }
const PLAATSEN = [['Gouda', 'veen', 'ja'], ['Zaanstad', 'veen', 'ja'], ['Dordrecht', 'klei', 'ja'], ['Schiedam', 'klei', 'ja'], ['Rotterdam', 'klei', 'ja'],
  ['Utrecht', 'klei', 'nee'], ['Leiden', 'klei', 'nee'], ['Amersfoort', 'zand', 'nee'], ['Eindhoven', 'zand', 'nee'], ['Zwolle', 'zand', 'nee'], ['Haarlem', 'zand', 'nee'], ['Groningen', 'klei', 'nee']];
const ADVISEURS = [
  { naam: 'J. de Vries', kantoor: 'Hypotheekhuis Oost', cert: true },
  { naam: 'S. Bakker', kantoor: 'Bakker Advies', cert: false },
  { naam: 'M. Jansen', kantoor: 'Jansen & Co Financieel', cert: true },
  { naam: 'R. El Amrani', kantoor: 'Woonadvies Zuid', cert: false },
  { naam: 'L. Visser', kantoor: 'Visser Hypotheken', cert: false }];
const VOORN = ['A.', 'B.', 'C.', 'D.', 'E.', 'F.', 'G.', 'H.', 'I.', 'K.', 'L.', 'M.', 'N.', 'P.', 'R.', 'S.', 'T.', 'W.'];
const ACHTERN = ['Smit', 'Meijer', 'de Boer', 'Mulder', 'de Groot', 'Bos', 'Vos', 'Peters', 'Hendriks', 'van Leeuwen', 'Dekker', 'Brouwer', 'de Wit', 'Dijkstra', 'Kok', 'Jacobs', 'van der Berg', 'Vermeulen', 'Willems', 'Kaya', 'Yilmaz', 'Schouten', 'Hoekstra', 'Koster'];

function genPortfolio(n = 48) {
  const r = rng(20261127), pick = a => a[Math.floor(r() * a.length)], between = (a, b) => a + r() * (b - a), int = (a, b) => Math.floor(between(a, b + 1));
  const out = [];
  for (let i = 0; i < n; i++) {
    const [plaats, grond, aand] = pick(PLAATSEN);
    const start = int(1997, 2023), partner = r() < .62;
    const gb1 = int(1956, 1993), gb2 = partner ? gb1 + int(-4, 4) : null;
    const ink1 = Math.round(between(34000, 98000) / 500) * 500, ink2 = partner ? (r() < .15 ? 0 : Math.round(between(18000, 62000) / 500) * 500) : 0;
    const orig = Math.round(Math.min(between(170000, 480000), (ink1 + ink2) * between(3.2, 4.6)) / 1000) * 1000;
    const verstreken = PARAMS.jaar - start, rest = Math.max(12, (30 - verstreken) * 12);
    const afvr = start < 2013 && r() < .55 ? Math.round(orig * between(.3, .5) / 1000) * 1000 : 0;
    const ann = orig - afvr, annSaldo = Math.round(ann * Math.max(.08, 1 - Math.pow(verstreken / 30, 1.4)) / 100) * 100;
    const rvp = Math.min(int(PARAMS.jaar, PARAMS.jaar + 9), start + 29), aftrekEind = start + 30;
    const rente = +(start > 2015 && start < 2022 ? between(1.4, 2.4) : between(2.2, 4.9)).toFixed(2);
    const delen = [{ vorm: 'annuitair', saldo: annSaldo, rente, restLooptijd: rest, rvpEindJaar: rvp, aftrekEindJaar: aftrekEind, box: 1 }];
    if (afvr) delen.push({ vorm: 'aflossingsvrij', saldo: afvr, rente: +(rente + .2).toFixed(2), restLooptijd: rest, rvpEindJaar: rvp, aftrekEindJaar: aftrekEind, box: 1 });
    const bouwjaar = r() < .45 ? int(1895, 1969) : int(1970, 2021);
    const waarde = Math.round(orig * between(1.05, 1.9) / 1000) * 1000;
    const wjaar = int(2017, 2026), wbron = wjaar >= 2024 ? pick(['Calcasa (AVM)', 'PandWise (indicatief)', 'Taxatierapport']) : pick(['Taxatierapport', 'WOZ-geïndexeerd']);
    const fundering = bouwjaar < 1970 && grond !== 'zand' ? (r() < .7 ? 'hout' : 'onbekend') : (bouwjaar < 1970 ? 'staal' : 'beton');
    const k = { naam1: `${pick(VOORN)} ${pick(ACHTERN)}`, partner, naam2: partner ? `${pick(VOORN)} ${pick(ACHTERN)}` : '', geboortejaar1: gb1, geboortejaar2: gb2,
      inkomen1: ink1, inkomen2: ink2, pensioen1: '', pensioen2: '', orv1: 0, orv2: partner && r() < .6 ? Math.round(orig * .5 / 5000) * 5000 : 0, nabestaanden: 0, nabestaanden2: 0,
      waarde, waardeDatum: `${wjaar}-${String(int(1, 12)).padStart(2, '0')}`, waardeBron: wbron, woz: Math.round(waarde * .94 / 1000) * 1000,
      bouwjaar, grond, aandachtsgebied: aand, grondwater: grond === 'veen' && r() < .7 ? 'ja' : 'nee', fundering, schade: r() < .05 ? 'ja' : 'nee', funderingExtern: '',
      onderhoud: '', onderhoudDoor: '', renteHerfin: PARAMS.renteHerfinDefault, inkomensdaling: 20, delen, startJaar: start };
    const adv = ADVISEURS[int(0, ADVISEURS.length - 1)];
    let status = pick(['niet', 'niet', 'niet', 'uitgenodigd', 'behandeling', 'afgerond', 'afgerond']), monitoring = null;
    if (status === 'afgerond') monitoring = `${int(2021, 2026)}-${String(int(1, 11)).padStart(2, '0')}-15`;
    if (status === 'afgerond' && r() < .5) k.onderhoud = pick(['goed', 'redelijk', 'matig', 'uitstekend']);
    out.push({ id: `HL-${String(240100 + i * 37)}`, klant: k.naam1 + (partner ? ' & ' + k.naam2.split(' ').slice(1).join(' ') : ''),
      adviseur: adv.naam, plaats, k, status, monitoring, brondata: status === 'behandeling' ? ISO(new Date(TODAY - int(3, 40) * 864e5)) : null, cijferDef: null });
  }
  out.forEach(p => { refresh(p); if (p.status === 'afgerond') p.cijferDef = p.res.totaal; });
  return out;
}

function refresh(p) {
  p.res = berekenDossier(p.k);
  if (p.status === 'afgerond' && p.monitoring && PARAMS.jaar - +p.monitoring.slice(0, 4) >= S.cyclus) p.status = 'herhaling';
  const last = p.monitoring ? +p.monitoring.slice(0, 4) : null;
  p.volgende = last ? last + S.cyclus : PARAMS.jaar;
  const sig = p.res.signalen;
  p.prio = sig.filter(s => s.ernst === 'hoog').length * 3 + sig.filter(s => s.ernst === 'middel').length + (p.status === 'afgerond' ? -4 : 0) + (p.res.samenloop ? 2 : 0);
  p.rvp = Math.min(...p.k.delen.map(d => d.rvpEindJaar || 9999));
  p.aftrek = Math.min(...p.k.delen.map(d => d.aftrekEindJaar || 9999));
  p.saldo = p.res.schuld;
}

/* ---------- Gedeelde UI-stukjes ---------- */
const cls = c => kleur(c);
const cBadge = (c, voorlopig) => `<span class="c ${cls(c)} ${voorlopig ? 'vl' : ''}" title="${voorlopig ? 'Voorlopig: berekend op geldverstrekkerdata, nog niet met klant geverifieerd' : 'Vastgesteld met klant en adviseur'}">${fmtNum(c)}</span>`;
const ernstB = e => e === 'hoog' ? 'risico' : e === 'middel' ? 'krap' : 'neu';
const sigBadges = sig => sig.map(s => `<span class="b ${ernstB(s.ernst)}" title="${esc(s.tekst)}">${s.code.replace('EWI-', '')}</span>`).join(' ') || '<span class="muted">–</span>';
const fundB = f => `<span class="b ${f.niveau === 'hoog' ? 'risico' : f.niveau === 'middel' ? 'krap' : 'goed'}">${fmtNum(f.cijfer)}</span>`;
const ltvB = l => l == null ? '–' : `<span class="${l > 1 ? 'b risico' : l > .9 ? 'b krap' : ''}">${fmtPct(l * 100, 0)}</span>`;
const advInfo = n => ADVISEURS.find(a => a.naam === n) || { naam: n, kantoor: '', cert: false };

function setView(v) {
  S.view = v; document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  render(); window.scrollTo(0, 0);
}
document.getElementById('nav').addEventListener('click', e => { if (e.target.dataset.v) setView(e.target.dataset.v); });

function render() {
  const app = document.getElementById('app');
  ({ gv: renderGV, adv: renderAdv, klant: renderKlant, kader: renderKader })[S.view](app);
}

/* ================= Geldverstrekker ================= */
function filtered() {
  const f = S.filter, q = f.q.toLowerCase();
  let a = S.portfolio.filter(p => (!q || (p.id + p.klant + p.plaats + p.adviseur).toLowerCase().includes(q))
    && (!f.status || p.status === f.status) && (!f.adviseur || p.adviseur === f.adviseur)
    && (!f.signaal || p.res.signalen.some(s => s.code === f.signaal)));
  const k = S.sort.k, d = S.sort.d;
  const val = p => ({ prio: p.prio, id: p.id, klant: p.klant, adviseur: p.adviseur, plaats: p.plaats, saldo: p.saldo, ltv: p.res.ltv, waarde: p.k.waardeDatum, rvp: p.rvp, aftrek: p.aftrek,
    fund: p.res.fund.cijfer, cijfer: p.cijferDef ?? p.res.totaal, status: p.status, volgende: p.volgende })[k];
  return a.sort((x, y) => { const A = val(x), B = val(y); return (A > B ? 1 : A < B ? -1 : 0) * d; });
}

function kpis(list) {
  const n = list.length, saldo = list.reduce((s, p) => s + p.saldo, 0);
  const binnen = list.filter(p => p.status === 'afgerond').length;
  const herw = list.filter(p => PARAMS.jaar - +p.k.waardeDatum.slice(0, 4) < 3).length;
  const wltv = list.reduce((s, p) => s + p.saldo * (p.res.ltv || 0), 0) / (saldo || 1);
  const sam = list.filter(p => p.res.samenloop).length, fund = list.filter(p => p.res.fund.niveau === 'hoog').length;
  const laag = list.filter(p => (p.cijferDef ?? p.res.totaal) < 5.5).length;
  const ltv100 = list.filter(p => p.res.ltv > 1 || p.res.ltvStress > 1).length;
  return { n, saldo, binnen, herw, wltv, sam, fund, laag, ltv100 };
}

function renderGV(app) {
  const K = kpis(S.portfolio), list = filtered();
  const statusOpts = Object.entries(STATUS).map(([k, v]) => `<option value="${k}" ${S.filter.status === k ? 'selected' : ''}>${v}</option>`).join('');
  const advOpts = ADVISEURS.map(a => `<option ${S.filter.adviseur === a.naam ? 'selected' : ''}>${a.naam}</option>`).join('');
  const sigOpts = [['EWI-BET', 'Betaalbaarheid'], ['EWI-SAM', 'Samenloop'], ['EWI-LTV', 'LTV / onderpand'], ['EWI-FUN', 'Fundering'], ['EWI-VAL', 'Waardering verouderd']]
    .map(([k, v]) => `<option value="${k}" ${S.filter.signaal === k ? 'selected' : ''}>${v}</option>`).join('');
  const col = (k, t, r) => `<th data-s="${k}" class="${r ? 'r' : ''}">${t}${S.sort.k === k ? (S.sort.d > 0 ? ' ▲' : ' ▼') : ''}</th>`;
  app.innerHTML = `
  <div class="row"><div><h1>Portefeuillemonitoring</h1><p class="sub">${esc(S.gv)} · peiljaar ${PARAMS.jaar} · uitvraagcyclus elke ${S.cyclus} jaar</p></div><div class="sp"></div>
    <label class="f" style="width:150px">Cyclus (jaar)<select id="cyc">${[3, 4, 5].map(c => `<option ${c === S.cyclus ? 'selected' : ''}>${c}</option>`).join('')}</select></label></div>
  <div class="grid kpis">
    ${kpi('Leningen', fmtInt(K.n), fmtEUR(K.saldo) + ' uitstaand')}
    ${kpi('Monitoringdekking', fmtPct(K.binnen / K.n * 100, 0), `${K.binnen} afgerond binnen ${S.cyclus} jaar`)}
    ${kpi('Waardering < 3 jaar', fmtPct(K.herw / K.n * 100, 0), 'actuele onderpandwaarde')}
    ${kpi('Gewogen LTV', fmtPct(K.wltv * 100, 0), `${K.ltv100} met (stress-)LTV > 100%`)}
    ${kpi('Samenloop ≤ 5 jaar', fmtInt(K.sam), 'renteschok · aftrek · pensioen')}
    ${kpi('Funderingsrisico hoog', fmtInt(K.fund), 'funderingscijfer ≤ 4')}
    ${kpi('Cijfer < 5,5', fmtInt(K.laag), 'voorlopig of vastgesteld')}
  </div>
  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(320px,1fr));margin-top:14px">
    <div class="card"><h3>Uitvraagplanning per jaar</h3>${planChart()}<p class="note">Volgende uitvraag = laatste monitoring + cyclus; nooit gemonitord = direct.</p></div>
    <div class="card"><h3>Verdeling hypotheekcijfer</h3>${distChart()}<p class="note">Gestippeld = voorlopig (geldverstrekkerdata), vol = vastgesteld met klant.</p></div>
  </div>
  <div class="card" style="margin-top:14px">
    <div class="row" style="margin-bottom:10px">
      <input id="q" placeholder="Zoek lening, klant, plaats…" value="${esc(S.filter.q)}" style="flex:1;min-width:180px">
      <select id="fs"><option value="">Alle statussen</option>${statusOpts}</select>
      <select id="fa"><option value="">Alle adviseurs</option>${advOpts}</select>
      <select id="fsig"><option value="">Alle signalen</option>${sigOpts}</select>
    </div>
    <div class="row" style="margin-bottom:10px">
      <span class="note">${list.length} van ${S.portfolio.length} leningen · klik op een regel om het dossier te openen</span><div class="sp"></div>
      <button class="btn s" id="inv">Selectie uitnodigen via adviseur</button>
      <button class="btn s" id="csv">Export CSV</button>
      <button class="btn s" id="tpl">CSV-sjabloon</button>
      <label class="btn s">Importeer CSV<input type="file" id="imp" accept=".csv,text/csv" class="hide"></label>
      <button class="btn s p" id="rap">Toezichtrapportage</button>
    </div>
    <div class="scroll"><table class="tbl" id="pt"><thead><tr>
      ${col('id', 'Lening')}${col('klant', 'Klant')}${col('adviseur', 'Adviseur')}${col('plaats', 'Plaats')}${col('saldo', 'Saldo', 1)}${col('ltv', 'LTV', 1)}
      ${col('waarde', 'Waardepeil')}${col('rvp', 'Einde RVP')}${col('aftrek', 'Einde aftrek')}${col('fund', 'Fund.')}${col('cijfer', 'Cijfer')}<th>Signalen</th>${col('status', 'Status')}${col('volgende', 'Volgende')}

/* ---------- CSV ---------- */
const CSV_HEAD = ['lening', 'klant', 'adviseur', 'plaats', 'geboortejaar1', 'inkomen1', 'partner', 'geboortejaar2', 'inkomen2', 'waarde', 'waardeDatum', 'waardeBron', 'woz', 'bouwjaar', 'grond', 'aandachtsgebied', 'fundering',
  'vorm', 'saldo', 'rente', 'restLooptijdMnd', 'rvpEindJaar', 'aftrekEindJaar', 'laatsteMonitoring'];
function toCSV(list) {
  const h = ['lening', 'klant', 'adviseur', 'plaats', 'saldo', 'waarde', 'waardeDatum', 'waardeBron', 'ltv', 'stressLtv', 'eindeRvp', 'eindeAftrek', 'funderingscijfer', 'funderingsniveau',
    'hypotheekcijfer', 'cijferType', 'laagsteScenario', 'samenloop', 'signalen', 'status', 'laatsteMonitoring', 'volgendeUitvraag'];
  const n = x => typeof x === 'number' ? String(Math.round(x * 100) / 100).replace('.', ',') : `"${String(x ?? '').replace(/"/g, '""')}"`;
  return '﻿' + h.join(';') + '\n' + list.map(p => [p.id, p.klant, p.adviseur, p.plaats, p.saldo, p.k.waarde, p.k.waardeDatum, p.k.waardeBron, p.res.ltv, p.res.ltvStress, p.rvp, p.aftrek,
    p.res.fund.cijfer, p.res.fund.niveau, p.cijferDef ?? p.res.totaal, p.cijferDef == null ? 'voorlopig' : 'vastgesteld', p.res.laagste.titel,
    p.res.samenloop ? `${p.res.samenloop.van}-${p.res.samenloop.tot}` : '', p.res.signalen.map(s => s.code).join(' '), STATUS[p.status], p.monitoring || '', p.volgende].map(n).join(';')).join('\n');
}
function download(name, text) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: 'text/csv;charset=utf-8' })); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function importCSV(file) {
  if (!file) return;
  const fr = new FileReader();
  fr.onload = () => {
    const lines = String(fr.result).replace(/^﻿/, '').split(/\r?\n/).filter(l => l.trim());
    const sep = lines[0].includes(';') ? ';' : ',', head = lines[0].split(sep).map(h => h.trim());
    const idx = h => head.indexOf(h), map = new Map(); let fout = 0;
    lines.slice(1).forEach(l => {
      const c = l.split(sep).map(x => x.trim().replace(/^"|"$/g, '')), g = h => idx(h) >= 0 ? c[idx(h)] : '';
      if (!g('lening') || !g('saldo')) { fout++; return; }
      const deel = { vorm: g('vorm') || 'annuitair', saldo: parseNum(g('saldo')), rente: parseNum(g('rente')), restLooptijd: parseNum(g('restLooptijdMnd')) || 360,
        rvpEindJaar: parseNum(g('rvpEindJaar')) || null, aftrekEindJaar: parseNum(g('aftrekEindJaar')) || null, box: 1 };
      if (map.has(g('lening'))) { map.get(g('lening')).k.delen.push(deel); return; }
      const partner = /^(ja|j|1|true)$/i.test(g('partner'));
      const k = { naam1: g('klant'), partner, naam2: partner ? 'partner' : '', geboortejaar1: parseNum(g('geboortejaar1')) || 1970, geboortejaar2: partner ? parseNum(g('geboortejaar2')) || 1970 : null,
        inkomen1: parseNum(g('inkomen1')), inkomen2: partner ? parseNum(g('inkomen2')) : 0, pensioen1: '', pensioen2: '', orv1: 0, orv2: 0, nabestaanden: 0, nabestaanden2: 0,
        waarde: parseNum(g('waarde')), waardeDatum: g('waardeDatum') || String(PARAMS.jaar), waardeBron: g('waardeBron') || 'Onbekend', woz: parseNum(g('woz')) || parseNum(g('waarde')),
        bouwjaar: parseNum(g('bouwjaar')), grond: g('grond') || 'zand', aandachtsgebied: g('aandachtsgebied') || 'nee', grondwater: 'nee', fundering: g('fundering') || 'onbekend', schade: 'nee', funderingExtern: '',
        onderhoud: '', onderhoudDoor: '', renteHerfin: PARAMS.renteHerfinDefault, inkomensdaling: 20, delen: [deel] };
      const lm = g('laatsteMonitoring');
      map.set(g('lening'), { id: g('lening'), klant: g('klant'), adviseur: g('adviseur') || ADVISEURS[0].naam, plaats: g('plaats'), k, status: lm ? 'afgerond' : 'niet', monitoring: lm || null, brondata: null, cijferDef: null });
    });
    if (!map.size) { alert('Geen geldige regels gevonden. Gebruik het CSV-sjabloon (scheidingsteken ;).'); return; }
    if (!confirm(`${map.size} leningen gevonden${fout ? `, ${fout} regel(s) overgeslagen` : ''}. Demo-portefeuille vervangen?`)) return;
    S.portfolio = [...map.values()]; S.portfolio.forEach(refresh); S.filter = { q: '', status: '', signaal: '', adviseur: '' }; render();
  };
  fr.readAsText(file, 'utf-8');
}

  }));
  el.querySelectorAll('[data-d]').forEach(inp => inp.addEventListener(inp.tagName === 'SELECT' ? 'change' : 'input', () => {
    const d = k.delen[+inp.closest('tr').dataset.i], key = inp.dataset.d;

  el.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { k.delen.splice(+b.dataset.rm, 1); renderForm(); renderRes(); });
}

function timeline(res) {
  const pts = res.scen.filter(s => s.groep === 'moment' && /^\d{4}/.test(s.wanneer));
  if (!pts.length) return '';
  const y0 = PARAMS.jaar, y1 = Math.max(y0 + 10, ...pts.map(s => +s.wanneer.slice(-4))) + 1, pos = y => ((y - y0) / (y1 - y0) * 100).toFixed(1) + '%';
  const ticks = []; for (let y = y0; y <= y1; y += Math.ceil((y1 - y0) / 6)) ticks.push(y);
  return `<div class="tl"><div class="ax"></div>${ticks.map(y => `<span class="y" style="left:${pos(y)}">${y}</span>`).join('')}
    ${pts.map((s, i) => `<span class="m" style="left:${pos(+s.wanneer.slice(0, 4))};top:${i % 2 ? 0 : 4}px" title="${esc(s.titel)}: ${fmtNum(s.cijfer)}"><i style="background:var(--${cls(s.cijfer)})"></i></span>`).join('')}</div>`;
}

}

        <tr><td>Funderingscijfer <span class="note">(${res.fund.bron})</span></td><td class="r">${fundB(res.fund)} <span class="note">${esc(res.fund.redenen.join(', ') || 'geen indicatoren')}</span></td></tr>
        <tr><td>Onderhoud</td><td class="r">${k.onderhoud ? esc(k.onderhoud) + (res.onderhoudCorr ? ` (${fmtPct(res.onderhoudCorr * 100, 0)})` : '') : '<span class="note">niet beoordeeld</span>'}</td></tr>
        <tr><td>Stress-waarde <span class="note">na fundering/onderhoud</span></td><td class="r">${fmtEUR(res.waardeStress)} · stress-LTV ${ltvB(res.ltvStress)}</td></tr>

/* ---------- Print (via window.open i.v.m. iframe-embed) ---------- */
function printWin(html) {
  const w = window.open('', '_blank');
  if (!w) { alert('Pop-up geblokkeerd: sta pop-ups toe om te printen.'); return; }
  w.document.write(html); w.document.close(); w.focus(); setTimeout(() => w.print(), 400);
}
