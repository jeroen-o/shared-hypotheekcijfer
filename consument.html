function interp(table, x) {
  if (x <= table[0][0]) return table[0][1];
  for (let i = 1; i < table.length; i++) {
    if (x <= table[i][0]) { const [x0, y0] = table[i - 1], [x1, y1] = table[i]; return y0 + (y1 - y0) * (x - x0) / (x1 - x0); }
  }
  return table[table.length - 1][1];
}

function annuiteit(schuld, rentePct, maanden) {
  if (schuld <= 0 || maanden <= 0) return 0;
  const r = rentePct / 100 / 12;
  if (r === 0) return schuld / maanden;
  return schuld * r / (1 - Math.pow(1 + r, -maanden));
}

/* Financieringslastpercentage uit Bijlage 1: rij = toetsinkomen (stappen van € 1.000, boven de tabel de hoogste rij),
   kolom = toetsrente-bracket. */
function normPct(tabel, toetsinkomen, toetsrente) {
  const t = LEENNORMEN_2027[tabel];
  const i = toetsinkomen < t.van ? 0 : Math.min(t.rijen.length - 1, 1 + Math.floor((toetsinkomen - t.van) / 1000));
  const g = LEENNORMEN_2027.rentegrenzen; let c = 0;
  while (c < g.length && toetsrente > g[c] + 1e-9) c++;
  return t.rijen[i][c] / 1000;
}

/* Leennormtoets: welk deel van de toegestane financieringslast gebruikt de (geprojecteerde) schuld?
   Per leningdeel eigen toetsrente en tabel (aftrekbaar / niet-aftrekbaar), annuïtair over 30 jaar. */
function normToets({ delen, n = 0, Y, toetsinkomen, aow, renteOverride = null, herRvp = 10, geenAftrek = false, factor = 1, labelBonus = 0 }) {
  const L = LEENNORMEN_2027; let gebruik = 0, schuld = 0, rtGewogen = 0;
  delen.forEach(d => {
    const saldo = (n ? projecteerSaldo(d, n) : d.saldo) * factor;
    if (saldo <= 0) return;
    let rt;
    if (renteOverride != null) rt = herRvp < 10 ? Math.max(renteOverride, L.minToetsrente) : renteOverride;
    else {
      const rvpRest = (d.rvpEindJaar || 9999) - Y, rest = d.restLooptijd - n;
      rt = (rvpRest < 10 || (d.vorm !== 'aflossingsvrij' && rest < 120)) ? Math.max(d.rente, L.minToetsrente) : d.rente;
    }
    const nietAftrek = geenAftrek || d.box === 3 || (d.aftrekEindJaar && d.aftrekEindJaar <= Y);
    const tabel = nietAftrek ? (aow ? 'box3WelAOW' : 'box3NietAOW') : (aow ? 'welAOW' : 'nietAOW');
    const pct = normPct(tabel, toetsinkomen, rt);
    gebruik += toetsinkomen > 0 ? annuiteit(saldo, rt, L.looptijdMnd) / (toetsinkomen * pct / 12) : Infinity;
    schuld += saldo; rtGewogen += saldo * rt;
  });
  let maxH;
  if (schuld > 0) maxH = isFinite(gebruik) ? schuld / gebruik + labelBonus : 0;
  else maxH = toetsinkomen * normPct(aow ? 'welAOW' : 'nietAOW', toetsinkomen, L.minToetsrente) / 12 / annuiteit(1, L.minToetsrente, L.looptijdMnd) + labelBonus;
  const ratio = schuld > 0 ? (maxH > 0 ? schuld / maxH : Infinity) : 0;
  return { ratio, maxH, ruimte: maxH - schuld, schuld, toetsrente: schuld ? rtGewogen / schuld : null, tabel: aow ? 'AOW' : 'niet-AOW', toetsinkomen };
}

/* Maandlast van één leningdeel op een gegeven moment. */
function deelLast(d, rentePct, restMaanden) {
  const schuld = d.saldo, rente = schuld * rentePct / 100 / 12;
  let aflossing = 0;
  if (d.vorm === 'annuitair') aflossing = annuiteit(schuld, rentePct, restMaanden) - rente;
  else if (d.vorm === 'lineair') aflossing = restMaanden > 0 ? schuld / restMaanden : 0;
  return { rente, aflossing, bruto: rente + aflossing };
}

/* Saldo-projectie van een deel na n maanden (bij huidige rente). */
function projecteerSaldo(d, n) {
  let s = d.saldo; const r = d.rente / 100 / 12; let rest = d.restLooptijd;
  for (let i = 0; i < n && rest > 0; i++, rest--) {
    if (d.vorm === 'annuitair') { const a = annuiteit(s, d.rente, rest); s -= (a - s * r); }
    else if (d.vorm === 'lineair') s -= s / rest;
  }
  return Math.max(0, s);
}

function cijferUitRatio(ratio) {
  if (!isFinite(ratio)) return 1;
  const c = ratio <= PARAMS.cijferSchaal[0][0] ? 10 : interp(PARAMS.cijferSchaal, ratio);
  return Math.round(Math.max(1, Math.min(10, c)) * 10) / 10;
}

/* Bereken alle scenario's voor één dossier. */

  const pens2 = k.partner ? (k.pensioen2 != null && k.pensioen2 !== '' ? +k.pensioen2 : ink2 * PARAMS.pensioenPctDefault) : 0;
  const delen = k.delen || [];
  const schuld = delen.reduce((s, d) => s + d.saldo, 0);

      bruto += l.bruto; rente += l.rente;
      const aftrek = opts.aftrek === false ? false : (d.aftrekEindJaar ? d.aftrekEindJaar > jaar + (opts.jarenVooruit || 0) : true);
      if (aftrek && d.box !== 3) aftrekbareRente += l.rente;
    });
    const voordeel = Math.max(0, (aftrekbareRente - woz * PARAMS.ewfPct / 12) * PARAMS.aftrekTarief);
    return { bruto, rente, netto: bruto - voordeel, voordeel };

    const toetsinkomen = Math.max(sc.i1, sc.i2) + Math.min(sc.i1, sc.i2) * LEENNORMEN_2027.tweedeInkomenFactor;
    const t = normToets({ delen: sc.delenX || delen, n: sc.delenX ? 0 : jr * 12, Y, toetsinkomen, aow, renteOverride: sc.rente ?? null,
      herRvp, geenAftrek: !!sc.geenAftrek, factor: sc.factor ?? 1, labelBonus });
    scen.push({ id: sc.id, titel: sc.titel, wanneer: sc.wanneer, inkomen: sc.i1 + sc.i2, bruto: sc.last.bruto, netto: sc.last.netto,
      cijfer: cijferUitRatio(t.ratio), ...t, toelichting: sc.toelichting, deltaNetto: sc.last.netto - huidigeLast.netto });
  };

  push({ id: 'huidig', titel: 'Huidige situatie', wanneer: 'Nu', i1: ink1, i2: ink2, last: huidigeLast, toelichting: 'Huidig inkomen, huidige schuld en rente.' });

  // Momenten na het einde van de looptijd tellen niet mee (lening is dan afgelost)
  const eindJaar = jaar + Math.ceil(Math.max(...delen.map(d => d.restLooptijd)) / 12);
  const binnen = y => y < eindJaar ? y : 9999;

  const rvpJaar = binnen(Math.min(...delen.map(d => d.rvpEindJaar || 9999)));
  if (rvpJaar < 9999) {
    const jr = Math.max(0, rvpJaar - jaar), [a, b] = inkOp(rvpJaar);
    push({ id: 'rente', titel: 'Einde rentevaste periode', wanneer: String(rvpJaar), jr, i1: a, i2: b, rente: herRente,
      last: maandlast({ rente: herRente, jarenVooruit: jr }), toelichting: `Herfinanciering tegen ${fmtPct(herRente)}, nieuwe rentevaste periode ${herRvp} jaar (aanname).` });
  }

  const aftrekEind = binnen(Math.min(...delen.map(d => d.aftrekEindJaar || 9999)));
  if (aftrekEind < 9999) {
    const jr = Math.max(0, aftrekEind - jaar), [a, b] = inkOp(aftrekEind);
    push({ id: 'aftrek', titel: 'Einde hypotheekrenteaftrek', wanneer: String(aftrekEind), jr, i1: a, i2: b, geenAftrek: true,
      last: maandlast({ aftrek: false, jarenVooruit: jr }), toelichting: 'De 30-jaarstermijn loopt af; getoetst met de tabel voor niet-aftrekbare delen.' });
  }

  const pensJaar = binnen(Math.min(aow1, aow2));
  if (pensJaar >= jaar && pensJaar < 9999) {
    const [a, b] = inkOp(pensJaar);
    push({ id: 'pensioen', titel: 'Pensionering', wanneer: String(pensJaar), jr: pensJaar - jaar, i1: a, i2: b,
      last: maandlast({ jarenVooruit: pensJaar - jaar }), toelichting: 'Inkomen daalt naar AOW + pensioen (opgave of 70%-aanname).' });
  }

  const momenten = [rvpJaar, aftrekEind, pensJaar].filter(x => x < 9999 && x >= jaar);
  let samenloop = null;
  if (momenten.length >= 2) {
    const span = Math.max(...momenten) - Math.min(...momenten);
    if (span <= 5) {
      const peil = Math.max(...momenten), [a, b] = inkOp(peil);
      push({ id: 'samenloop', titel: 'Samenloop ' + [rvpJaar <= peil && 'renteschok', aftrekEind <= peil && 'aftrek', pensJaar <= peil && 'pensioen'].filter(Boolean).join(' · '), wanneer: `${Math.min(...momenten)}–${peil}`, jr: peil - jaar, i1: a, i2: b,
        rente: rvpJaar <= peil ? herRente : null, geenAftrek: aftrekEind <= peil,
        last: maandlast({ rente: rvpJaar <= peil ? herRente : null, aftrek: aftrekEind <= peil ? false : null, jarenVooruit: peil - jaar }),
        toelichting: `${momenten.length} schokken vallen binnen ${span} jaar samen.` });
      samenloop = { van: Math.min(...momenten), tot: peil, aantal: momenten.length };
    }
  }

  const restEind = delen.filter(d => d.vorm === 'aflossingsvrij').reduce((s, d) => s + d.saldo, 0);
  if (restEind > 0) {
    const [a, b] = inkOp(eindJaar), r = restEind * herRente / 100 / 12;
    push({ id: 'looptijd', titel: 'Einde looptijd', wanneer: String(eindJaar), Y: eindJaar, i1: a, i2: b, geenAftrek: true,
      delenX: [{ vorm: 'aflossingsvrij', saldo: restEind, rente: herRente, restLooptijd: 360, rvpEindJaar: eindJaar + herRvp, box: 3 }],
      last: { bruto: r, netto: r }, toelichting: `${fmtEUR(restEind)} aflossingsvrij resteert; herfinanciering tegen ${fmtPct(herRente)} zonder aftrek.` });
  }

  const ww = x => Math.min(x, PARAMS.wwMaxJaar) * PARAMS.wwPct;
  push({ id: 'ww1', titel: `Werkloosheid ${k.naam1 || 'aanvrager 1'}`, wanneer: 'Direct', i1: ww(ink1), i2: ink2, last: huidigeLast, toelichting: 'WW 70% van het (gemaximeerde) loon.' });
  if (k.partner) push({ id: 'ww2', titel: `Werkloosheid ${k.naam2 || 'partner'}`, wanneer: 'Direct', i1: ink1, i2: ww(ink2), last: huidigeLast, toelichting: 'WW 70% van het (gemaximeerde) loon.' });
  push({ id: 'ao1', titel: `Arbeidsongeschiktheid ${k.naam1 || 'aanvrager 1'}`, wanneer: 'Na 2 jaar ziekte', i1: Math.min(ink1, PARAMS.wwMaxJaar) * PARAMS.aoPct, i2: ink2, last: huidigeLast,
    toelichting: 'Indicatief 70% van het gemaximeerde loon; zonder AOV/WIA-hiaatverzekering.' });

  if (k.partner) {
    const orv1 = +k.orv1 || 0, f1 = schuld > 0 ? Math.max(0, schuld - orv1) / schuld : 1;
    push({ id: 'overlijden1', titel: `Overlijden ${k.naam1 || 'aanvrager 1'}`, wanneer: 'Direct', i1: 0, i2: ink2 + (+k.nabestaanden2 || 0), factor: f1,
      last: { bruto: huidigeLast.bruto * f1, netto: huidigeLast.netto * f1 }, toelichting: orv1 ? `ORV-uitkering ${fmtEUR(orv1)} verlaagt de schuld.` : 'Geen overlijdensrisicoverzekering opgegeven.' });
    const orv = +k.orv2 || 0, f2 = schuld > 0 ? Math.max(0, schuld - orv) / schuld : 1;
    push({ id: 'overlijden', titel: `Overlijden ${k.naam2 || 'partner'}`, wanneer: 'Direct', i1: ink1 + (+k.nabestaanden || 0), i2: 0, factor: f2,
      last: { bruto: huidigeLast.bruto * f2, netto: huidigeLast.netto * f2 }, toelichting: orv ? `ORV-uitkering ${fmtEUR(orv)} verlaagt de schuld.` : 'Geen overlijdensrisicoverzekering opgegeven.' });
    push({ id: 'scheiding', titel: 'Scheiding (blijver neemt hypotheek over)', wanneer: 'Direct', i1: ink1, i2: 0, last: huidigeLast, toelichting: 'Eén inkomen draagt de volledige hypotheek.' });
  }

  const daling = +k.inkomensdaling || 20;
  push({ id: 'daling', titel: `Inkomensdaling ${daling}%`, wanneer: 'Direct', i1: ink1 * (1 - daling / 100), i2: ink2 * (1 - daling / 100), last: huidigeLast, toelichting: 'Bijvoorbeeld minder uren of lager loon.' });

  // Onderpand
  const waarde = +k.waarde || 0;
  const fund = funderingsRisico(k);
  const onderhoudCorr = k.onderhoud ? (PARAMS.onderhoudCorrectie[k.onderhoud] || 0) : 0;
  const waardeStress = Math.max(1, waarde * (1 + onderhoudCorr) - PARAMS.funderingHerstel[fund.niveau]);
  const ltv = waarde > 0 ? schuld / waarde : null;
  const ltvStress = waarde > 0 ? schuld / waardeStress : null;

  const MOM = ['rente', 'aftrek', 'pensioen', 'samenloop', 'looptijd'];
  const mom = scen.filter(x => MOM.includes(x.id)), ev = scen.filter(x => x.id !== 'huidig' && !MOM.includes(x.id));
  const minC = a => a.length ? Math.min(...a.map(x => x.cijfer)) : scen[0].cijfer;
  const totaal = Math.round(((scen[0].cijfer + minC(mom) + minC(ev)) / 3) * 10) / 10;
  scen.forEach(x => x.groep = x.id === 'huidig' ? 'nu' : MOM.includes(x.id) ? 'moment' : 'event');
  const laagste = scen.reduce((m, s) => s.cijfer < m.cijfer ? s : m, scen[0]);
  return { totaal, scen, huidigeLast, schuld, ltv, ltvStress, waardeStress, fund, onderhoudCorr, samenloop, laagste,
    signalen: signalen({ scen, ltv, ltvStress, fund, samenloop, k }) };
}

/* Indicatief funderingscijfer 1–10 (hoger = beter), zelfde indicatoren als Funderingscijfer.nl/PandWise.
   Is er een extern cijfer ingevoerd, dan wint dat. */
function funderingsRisico(k) {
  const r = [];
  if (k.funderingExtern) {
    const c = Math.max(1, Math.min(10, +k.funderingExtern));
    return { cijfer: c, niveau: c <= 4 ? 'hoog' : c <= 6.5 ? 'middel' : 'laag', redenen: ['extern funderingscijfer ingevoerd'], bron: 'extern' };
  }
  let p = 0; const bj = +k.bouwjaar || 0;
  if (bj && bj < 1925) { p += 3; r.push('bouwjaar vóór 1925'); }
  else if (bj && bj < 1970) { p += 2; r.push('bouwjaar 1925–1970'); }
  if (k.grond === 'veen') { p += 2; r.push('veengrond'); } else if (k.grond === 'klei') { p += 1; r.push('kleigrond'); }
  if (k.aandachtsgebied === 'ja') { p += 2; r.push('RVO-aandachtsgebied funderingsproblematiek'); }
  if (k.grondwater === 'ja') { p += 1; r.push('lage/dalende grondwaterstand'); }
  if (k.fundering === 'hout') { p += 2; r.push('houten palen'); } else if (k.fundering === 'staal') { p += 1; r.push('fundering op staal'); }
  if (k.schade === 'ja') { p += 3; r.push('zichtbare scheurvorming/scheefstand'); }
  const c = Math.round(Math.max(1, 10 - p * 0.75) * 10) / 10;
  return { cijfer: c, niveau: c <= 4 ? 'hoog' : c <= 6.5 ? 'middel' : 'laag', redenen: r, bron: 'indicatief' };
}

function signalen({ scen, ltv, ltvStress, fund, samenloop, k }) {
  const s = [];
  // Momenten (zeker in de tijd) wegen zwaarder dan life events (onzeker)
  const MOM = ['rente', 'aftrek', 'pensioen', 'samenloop', 'looptijd'];
  const minMom = Math.min(10, ...scen.filter(x => x.id === 'huidig' || MOM.includes(x.id)).map(x => x.cijfer));
  const minEv = Math.min(10, ...scen.filter(x => x.id !== 'huidig' && !MOM.includes(x.id)).map(x => x.cijfer));
  if (minMom < 4) s.push({ ernst: 'hoog', code: 'EWI-BET', tekst: 'Betaalbaarheid op een toekomstig moment onvoldoende (cijfer < 4).' });
  else if (minMom < 5.5) s.push({ ernst: 'middel', code: 'EWI-BET', tekst: 'Betaalbaarheid op een toekomstig moment krap (cijfer < 5,5).' });
  else if (minEv < 4) s.push({ ernst: 'middel', code: 'EWI-BET', tekst: 'Kwetsbaar bij een life event (cijfer < 4): controleer dekking/buffer.' });
  if (samenloop) s.push({ ernst: 'hoog', code: 'EWI-SAM', tekst: `Samenloop van ${samenloop.aantal} schokken tussen ${samenloop.van} en ${samenloop.tot}.` });
  if (ltv != null && ltv > 1) s.push({ ernst: 'hoog', code: 'EWI-LTV', tekst: `LTV ${fmtPct(ltv * 100, 0)}: onderpand dekt de schuld niet volledig.` });
  else if (ltvStress != null && ltvStress > 1) s.push({ ernst: 'middel', code: 'EWI-LTV', tekst: `Stress-LTV ${fmtPct(ltvStress * 100, 0)} na fundering/onderhoud-correctie.` });
  if (fund.niveau === 'hoog') s.push({ ernst: 'hoog', code: 'EWI-FUN', tekst: 'Verhoogd funderingsrisico: nader onderzoek aanbevolen.' });
  else if (fund.niveau === 'middel') s.push({ ernst: 'middel', code: 'EWI-FUN', tekst: 'Funderingsrisico-indicatoren aanwezig.' });
  if (k.waardeDatum) {
    const jr = PARAMS.jaar - +String(k.waardeDatum).slice(0, 4);
    if (jr >= 3) s.push({ ernst: 'middel', code: 'EWI-VAL', tekst: `Laatste waardebepaling ${jr} jaar oud.` });
  }
  return s;
}

function handelingsperspectief(sc, k, res) {
  const t = [];
  if (sc.ruimte < 0 && isFinite(sc.ruimte)) t.push(`De hypotheek is dan ${fmtEUR(-sc.ruimte)} hoger dan de leennorm toestaat.`);
  switch (sc.id) {
    case 'rente': t.push('Bespreek tijdig (12–24 maanden vooraf) renteverlenging, rentemiddeling of extra aflossen vóór de rentevaste periode afloopt.'); break;
    case 'aftrek': t.push('Overweeg extra aflossen of het omzetten naar een aflossingsvrij deel in box 3; reken het netto effect van het aftrekverval door.'); break;
    case 'pensioen': t.push('Vraag een pensioenoverzicht op (mijnpensioenoverzicht.nl) en toets of aflossen vóór pensioen of een lagere hypotheek nodig is.'); break;
    case 'samenloop': t.push('Plan een integraal adviesgesprek: de schokken versterken elkaar. Maak een aflosplan en stem rentevast op pensioendatum af.'); break;
    case 'ww1': case 'ww2': t.push('Bouw een buffer op van minimaal 3–6 netto maandlasten en overweeg een woonlastenverzekering.'); break;
    case 'looptijd': t.push('Maak een aflosplan voor het aflossingsvrije deel of bespreek tijdig verlengen/oversluiten; let op uw leeftijd en inkomen op dat moment.'); break;
    case 'ao1': t.push('Controleer het WIA-hiaat via de werkgever; overweeg een AOV of woonlastenverzekering.'); break;
    case 'overlijden1': case 'overlijden': t.push('Toets of de overlijdensrisicodekking (ORV) en het nabestaandenpensioen toereikend zijn.'); break;
    case 'scheiding': t.push('Bespreek wat er gebeurt bij uit elkaar gaan: overname, verkoop of hoofdelijke aansprakelijkheid.'); break;
    case 'daling': t.push('Breng uw vaste lasten in kaart en bespreek mogelijkheden zoals een langere looptijd of rentemiddeling.'); break;
    default: t.push('Geen directe actie nodig; blijf uw situatie periodiek monitoren.');
  }
  if (k.nhg === 'ja' && ['ww1', 'ww2', 'ao1', 'overlijden', 'overlijden1', 'scheiding', 'daling'].includes(sc.id)) t.push('Uw hypotheek heeft NHG: neem bij betalingsproblemen tijdig contact op met uw geldverstrekker, NHG kent hiervoor regelingen.');
  return t;
}

function kleur(c) { return c >= 7 ? 'goed' : c >= 5.5 ? 'let' : c >= 4 ? 'krap' : 'risico'; }
function label(c) { return c >= 7 ? 'Ruim betaalbaar' : c >= 5.5 ? 'Betaalbaar' : c >= 4 ? 'Krap' : 'Onvoldoende'; }

const nfEUR = new Intl.NumberFormat('nl-NL', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 });
function fmtEUR(x) { return isFinite(x) ? nfEUR.format(Math.round(x)) : '–'; }
function fmtPct(x, d = 2) { return isFinite(x) ? x.toLocaleString('nl-NL', { minimumFractionDigits: d, maximumFractionDigits: d }) + '%' : '–'; }
function fmtNum(x, d = 1) { return isFinite(x) ? x.toLocaleString('nl-NL', { minimumFractionDigits: d, maximumFractionDigits: d }) : '–'; }

if (typeof module !== 'undefined') module.exports = { PARAMS, berekenDossier, annuiteit, score, funderingsRisico, fmtEUR };
</script>
<script>
/* ================= Consumententool ================= */
const J = PARAMS.jaar;
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const parseNum = v => { const s = String(v ?? '').replace(/\s|€/g, '').replace(/\./g, '').replace(',', '.'); const n = parseFloat(s); return isFinite(n) ? n : 0; };
const fmtInt = n => Math.round(n || 0).toLocaleString('nl-NL');

const ST = { stap: 0, k: {
  naam1: '', partner: false, naam2: '', geboortejaar1: '', geboortejaar2: '', inkomen1: '', inkomen2: '', pensioen1: '', pensioen2: '',
  orv1: '', orv2: '', nabestaanden: '', nabestaanden2: '',
  waarde: '', woz: '', waardeDatum: `${J}-01`, waardeBron: 'Eigen schatting', bouwjaar: '', grond: 'zand', aandachtsgebied: 'nee', grondwater: 'nee',
  fundering: 'onbekend', schade: 'nee', funderingExtern: '', onderhoud: '', energielabel: 'geen', nhg: 'nee',
  renteHerfin: PARAMS.renteHerfinDefault, herRvp: 10, inkomensdaling: 20,
  delen: [{ vorm: 'annuitair', bedrag: '', rente: '', rvpJaar: '', eindJaar: '', startJaar: '' }]
}};
const STAPPEN = ['Over jou', 'Je hypotheek', 'Je woning', 'Als het tegenzit', 'Je cijfer'];

function render() {
  const app = document.getElementById('app');
  if (ST.stap === 0 && !ST.gestart) { app.innerHTML = intro(); app.querySelector('#start').onclick = () => { ST.gestart = true; render(); }; return; }
  if (ST.stap === 4) { renderResultaat(app); return; }
  app.innerHTML = `
    <div class="steps">${STAPPEN.map((_, i) => `<span class="${i <= ST.stap ? 'on' : ''}"></span>`).join('')}</div>
    <div class="stepl">Stap ${ST.stap + 1} van ${STAPPEN.length} · ${STAPPEN[ST.stap]}</div>
    <div class="card" id="form">${[stapJij, stapHypotheek, stapWoning, stapTegenzit][ST.stap]()}
      <div class="err" id="err"></div>
      <div class="nav"><button class="btn" id="terug">${ST.stap === 0 ? 'Terug naar start' : '← Vorige'}</button>
      <button class="btn p" id="verder">${ST.stap === 3 ? 'Bekijk mijn hypotheekcijfer' : 'Volgende →'}</button></div>
    </div>`;
  bind(app);
  app.querySelector('#terug').onclick = () => { if (ST.stap === 0) ST.gestart = false; else ST.stap--; render(); window.scrollTo(0, 0); };
  app.querySelector('#verder').onclick = () => {
    const e = valideer(ST.stap); if (e) { app.querySelector('#err').textContent = e; return; }
    ST.stap++; render(); window.scrollTo(0, 0);
  };
}

function intro() {
  return `<section class="hero">
    <h1>Scoor je hypotheekcijfer, en zie hoe jij ervoor staat.</h1>
    <p>Kun je je hypotheek blijven betalen als je rente straks omhooggaat, de renteaftrek stopt of je met pensioen gaat? En wat als er iets onverwachts gebeurt?</p>
    <p>Je krijgt een cijfer van 1 tot 10, plus een cijfer per belangrijk moment en per life event, met tips wat je kunt doen.</p>
    <div class="pills"><span class="pill">± 5 minuten</span><span class="pill">Leennormen ${PARAMS.normJaar}</span><span class="pill">Gegevens blijven in je browser</span><span class="pill">Gratis en vrijblijvend</span></div>
  </section>
  <div class="card"><h3>Wat heb je nodig?</h3>
    <ul style="margin:0 0 14px;padding-left:20px"><li>Je bruto jaarinkomen (en dat van je partner)</li><li>Je hypotheekgegevens: bedrag, rente en tot wanneer de rente vaststaat (staat op je jaaroverzicht)</li>
    <li>Een schatting van je woningwaarde</li><li>Eventueel: je verwachte pensioen (via mijnpensioenoverzicht.nl)</li></ul>
    <button class="btn p" id="start">Start de check</button>
    <p class="disc" style="margin-top:14px">Dit is een indicatie, geen hypotheekadvies. Wil je advies? Bespreek je uitkomst met je hypotheekadviseur.</p></div>`;
}

/* ---------- velden ---------- */
const f = {
  eur: (key, lbl, help = '', ph = '€ 0') => `<label class="f">${lbl}<input data-k="${key}" data-eur inputmode="numeric" placeholder="${ph}" value="${ST.k[key] === '' ? '' : fmtInt(ST.k[key])}">${help ? `<small>${help}</small>` : ''}</label>`,
  num: (key, lbl, help = '', ph = '') => `<label class="f">${lbl}<input data-k="${key}" data-num inputmode="decimal" placeholder="${ph}" value="${String(ST.k[key] ?? '').replace('.', ',')}">${help ? `<small>${help}</small>` : ''}</label>`,
  txt: (key, lbl, ph = '') => `<label class="f">${lbl}<input data-k="${key}" placeholder="${ph}" value="${esc(ST.k[key])}"></label>`,
  sel: (key, lbl, opts, help = '') => `<label class="f">${lbl}<select data-k="${key}">${opts.map(([v, t]) => `<option value="${v}" ${String(ST.k[key]) === v ? 'selected' : ''}>${t}</option>`).join('')}</select>${help ? `<small>${help}</small>` : ''}</label>`,
  seg: (key, lbl, opts) => `<div class="f" style="display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600">${lbl}<div class="seg">${opts.map(([v, t]) => `<button type="button" data-seg="${key}" data-v="${v}" class="${String(ST.k[key]) === v ? 'on' : ''}">${t}</button>`).join('')}</div></div>`
};

function stapJij() {
  const k = ST.k;
  return `<h2>Over jou</h2><p class="lead">Je inkomen bepaalt hoeveel hypotheek bij je past. Vul het bruto jaarinkomen in, inclusief vakantiegeld en vaste 13e maand.</p>
  <div class="fg">${f.seg('partner', 'Koop je samen?', [['false', 'Alleen'], ['true', 'Met partner']])}</div>
  <h3 style="margin-top:20px">Jij</h3>
  <div class="fg">${f.txt('naam1', 'Voornaam (optioneel)', 'bijv. Sanne')}${f.num('geboortejaar1', 'Geboortejaar', '', 'bijv. 1968')}
    ${f.eur('inkomen1', 'Bruto jaarinkomen')}${f.eur('pensioen1', 'Verwacht pensioen per jaar (incl. AOW)', 'Leeg laten? Dan rekenen we met 70% van je inkomen.', 'optioneel')}</div>
  ${k.partner ? `<h3 style="margin-top:20px">Je partner</h3>
  <div class="fg">${f.txt('naam2', 'Voornaam (optioneel)', 'bijv. Daan')}${f.num('geboortejaar2', 'Geboortejaar', '', 'bijv. 1970')}
    ${f.eur('inkomen2', 'Bruto jaarinkomen')}${f.eur('pensioen2', 'Verwacht pensioen per jaar (incl. AOW)', 'Leeg = 70% van het inkomen.', 'optioneel')}</div>` : ''}
  <div class="hint">Tip: je verwachte pensioen vind je op mijnpensioenoverzicht.nl.</div>`;
}

function stapHypotheek() {
  const k = ST.k;
  return `<h2>Je hypotheek</h2><p class="lead">Kijk op je jaaroverzicht van de geldverstrekker. Heb je meerdere leningdelen? Voeg ze apart toe.</p>
  ${k.delen.map((d, i) => `<div class="deel" data-i="${i}">${k.delen.length > 1 ? `<button class="btn s x" data-rm="${i}">Verwijder</button>` : ''}
    <h3>Leningdeel ${i + 1}</h3>
    <div class="fg">
      <label class="f">Soort<select data-d="vorm">${[['annuitair', 'Annuïteit'], ['lineair', 'Lineair'], ['aflossingsvrij', 'Aflossingsvrij']].map(([v, t]) => `<option value="${v}" ${d.vorm === v ? 'selected' : ''}>${t}</option>`).join('')}</select></label>
      <label class="f">Openstaand bedrag<input data-d="bedrag" data-eur inputmode="numeric" placeholder="€ 0" value="${d.bedrag === '' ? '' : fmtInt(d.bedrag)}"></label>
      <label class="f">Rente %<input data-d="rente" data-num inputmode="decimal" placeholder="bijv. 2,1" value="${String(d.rente).replace('.', ',')}"></label>
      <label class="f">Rente staat vast tot (jaar)<input data-d="rvpJaar" data-num inputmode="numeric" placeholder="bijv. ${J + 3}" value="${d.rvpJaar}"></label>
      <label class="f">Einde looptijd (jaar)<input data-d="eindJaar" data-num inputmode="numeric" placeholder="bijv. ${J + 18}" value="${d.eindJaar}"></label>
      <label class="f">Afgesloten in (jaar)<input data-d="startJaar" data-num inputmode="numeric" placeholder="bijv. ${J - 12}" value="${d.startJaar}"><small>Voor het einde van je renteaftrek (30 jaar na start).</small></label>
    </div></div>`).join('')}
  <button class="btn s" id="add">+ Leningdeel toevoegen</button>
  <div class="fg" style="margin-top:18px">${f.sel('nhg', 'Heb je Nationale Hypotheek Garantie (NHG)?', [['nee', 'Nee / weet ik niet'], ['ja', 'Ja']])}</div>
  <div class="hint">Aflossingsvrij deel afgesloten vanaf 2013? Dan is de rente meestal niet aftrekbaar; daar rekenen we mee.</div>`;
}

function stapWoning() {
  return `<h2>Je woning</h2><p class="lead">De waarde van je woning laat zien hoeveel je hypotheek gedekt is. Een schatting is prima.</p>
  <div class="fg">${f.eur('waarde', 'Geschatte woningwaarde', 'Weet je het niet? Neem je WOZ-waarde.')}${f.eur('woz', 'WOZ-waarde', 'Staat op je aanslag gemeentebelastingen.', 'optioneel')}
    ${f.num('bouwjaar', 'Bouwjaar', '', 'bijv. 1965')}
    ${f.sel('energielabel', 'Energielabel', Object.keys(LEENNORMEN_2027.energielabel).map(x => [x, x === 'geen' ? 'Weet ik niet / geen' : 'Label ' + x]), 'Een zuinig label geeft extra leenruimte.')}</div>
  <h3 style="margin-top:20px">Fundering <span class="muted" style="font-weight:400;font-size:14px">(vooral bij woningen van vóór 1970)</span></h3>
  <div class="fg">${f.sel('grond', 'Ondergrond', [['zand', 'Zand / weet ik niet'], ['klei', 'Klei'], ['veen', 'Veen']])}
    ${f.sel('aandachtsgebied', 'Gemeente met bekende funderingsproblemen?', [['nee', 'Nee / weet ik niet'], ['ja', 'Ja']], 'Bijv. delen van Gouda, Zaanstad, Dordrecht, Schiedam.')}
    ${f.sel('schade', 'Zie je scheuren of scheefstand?', [['nee', 'Nee'], ['ja', 'Ja']])}</div>
  <div class="hint">Een indicatie van je woningwaarde, funderings- en klimaatrisico kun je ook gratis opvragen via PandWise.nl of Funderingscijfer.nl. Let op: een indicatieve waarde is geen taxatie.</div>`;
}

function stapTegenzit() {
  const k = ST.k;
  return `<h2>Als het tegenzit</h2><p class="lead">We rekenen ook uit wat er gebeurt bij werkloosheid, arbeidsongeschiktheid, overlijden of scheiding. Heb je verzekeringen? Vul ze in, dan tellen ze mee.</p>
  ${k.partner ? `<div class="fg">${f.eur('orv1', `Overlijdensrisicoverzekering op leven ${esc(k.naam1 || 'jij')}`, 'Uitkering verlaagt de hypotheek.', 'optioneel')}
    ${f.eur('orv2', `Overlijdensrisicoverzekering op leven ${esc(k.naam2 || 'partner')}`, '', 'optioneel')}
    ${f.eur('nabestaanden2', `Nabestaandenpensioen voor ${esc(k.naam2 || 'partner')} per jaar`, '', 'optioneel')}
    ${f.eur('nabestaanden', `Nabestaandenpensioen voor ${esc(k.naam1 || 'jou')} per jaar`, '', 'optioneel')}</div>`
    : '<p class="muted">Je koopt alleen; overlijden en scheiding laten we daarom buiten beschouwing.</p>'}
  <details style="margin-top:18px"><summary>Aannames aanpassen</summary><div class="fg" style="margin-top:12px">
    ${f.num('renteHerfin', 'Rente na einde rentevaste periode %', 'Onze aanname voor de toekomstige rente.')}
    ${f.num('herRvp', 'Nieuwe rentevaste periode (jaar)', 'Korter dan 10 jaar? Dan toetsen we met minimaal 5%.')}
    ${f.num('inkomensdaling', 'Scenario inkomensdaling %')}</div></details>`;
}

function bind(app) {
  app.querySelectorAll('[data-k]').forEach(el => el.addEventListener(el.tagName === 'SELECT' ? 'change' : 'input', () => {
    let v = el.value;
    if (el.hasAttribute('data-eur')) v = el.value.trim() === '' ? '' : parseNum(el.value);
    else if (el.hasAttribute('data-num')) v = el.value.trim() === '' ? '' : parseNum(el.value.replace('.', ','));
    ST.k[el.dataset.k] = v;
  }));
  app.querySelectorAll('[data-eur]').forEach(el => el.addEventListener('blur', () => { if (el.value.trim() !== '') el.value = fmtInt(parseNum(el.value)); }));
  app.querySelectorAll('[data-seg]').forEach(b => b.onclick = () => { ST.k[b.dataset.seg] = b.dataset.v === 'true' ? true : b.dataset.v === 'false' ? false : b.dataset.v; render(); });
  app.querySelectorAll('[data-d]').forEach(el => el.addEventListener(el.tagName === 'SELECT' ? 'change' : 'input', () => {
    const d = ST.k.delen[+el.closest('.deel').dataset.i], key = el.dataset.d;
    d[key] = key === 'vorm' ? el.value : (el.value.trim() === '' ? '' : parseNum(el.value.replace(key === 'rente' ? '.' : '\u0000', ',')));
  }));
  const add = app.querySelector('#add');
  if (add) add.onclick = () => { ST.k.delen.push({ vorm: 'aflossingsvrij', bedrag: '', rente: '', rvpJaar: '', eindJaar: '', startJaar: '' }); render(); };
  app.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { ST.k.delen.splice(+b.dataset.rm, 1); render(); });
}

function valideer(stap) {
  const k = ST.k, gj = x => x >= 1930 && x <= J - 18;
  if (stap === 0) {
    if (!gj(+k.geboortejaar1)) return 'Vul een geldig geboortejaar in.';
    if (!(k.inkomen1 > 0) && !(k.partner && k.inkomen2 > 0)) return 'Vul een bruto jaarinkomen in.';
    if (k.partner && !gj(+k.geboortejaar2)) return 'Vul het geboortejaar van je partner in.';
  }
  if (stap === 1) {
    for (const [i, d] of k.delen.entries()) {
      const n = `Leningdeel ${i + 1}: `;
      if (!(d.bedrag > 0)) return n + 'vul het openstaande bedrag in.';
      if (!(d.rente >= 0 && d.rente < 15) || d.rente === '') return n + 'vul de rente in (bijv. 2,1).';
      if (!(d.eindJaar > J)) return n + `het einde van de looptijd moet na ${J} liggen.`;
      if (d.rvpJaar !== '' && (d.rvpJaar < J || d.rvpJaar > d.eindJaar)) return n + 'het einde van de rentevaste periode ligt niet tussen nu en het einde van de looptijd.';
      if (d.startJaar !== '' && (d.startJaar < 1970 || d.startJaar > J)) return n + 'controleer het jaar van afsluiten.';
    }
  }
  if (stap === 2 && !(k.waarde > 0) && !(k.woz > 0)) return 'Vul een (geschatte) woningwaarde of WOZ-waarde in.';
  return '';
}

/* Consumentgegevens → dossier voor de rekenkern */
function naarDossier() {
  const k = ST.k;
  const delen = k.delen.map(d => {
    const start = d.startJaar || null, box3 = d.vorm === 'aflossingsvrij' && start && start >= 2013;
    return { vorm: d.vorm, saldo: +d.bedrag, rente: +d.rente, restLooptijd: Math.max(12, (+d.eindJaar - J) * 12),
      rvpEindJaar: d.rvpJaar || +d.eindJaar, aftrekEindJaar: start ? start + 30 : null, box: box3 ? 3 : 1 };
  });
  const bj = +k.bouwjaar || 0;
  return { ...k, partner: !!k.partner, geboortejaar1: +k.geboortejaar1, geboortejaar2: k.partner ? +k.geboortejaar2 : null,
    inkomen1: +k.inkomen1 || 0, inkomen2: k.partner ? (+k.inkomen2 || 0) : 0, waarde: +k.waarde || +k.woz, woz: +k.woz || +k.waarde,
    fundering: bj && bj < 1970 && k.grond !== 'zand' ? 'onbekend' : 'beton', delen };
}

/* ---------- Resultaat ---------- */
const UITLEG = {
  rente: 'Na afloop betaal je de rente die dan geldt. Die kan hoger zijn dan nu.',
  aftrek: 'Je kunt de hypotheekrente maximaal 30 jaar aftrekken. Daarna stijgen je netto lasten.',
  pensioen: 'Bij pensioen daalt je inkomen meestal, terwijl de hypotheek doorloopt.',
  samenloop: 'Een paar grote veranderingen vallen kort na elkaar. Dat maakt het extra spannend.',
  looptijd: 'Aan het einde van de looptijd moet het aflossingsvrije deel worden afgelost of opnieuw gefinancierd.',
  ww1: 'Bij werkloosheid krijg je WW: ongeveer 70% van je loon, tot een maximum.', ww2: 'Bij werkloosheid krijg je WW: ongeveer 70% van je loon, tot een maximum.',
  ao1: 'Na 2 jaar ziekte krijg je een WIA-uitkering. Die is vaak lager dan je loon.',
  overlijden1: 'Valt een inkomen weg, dan moet het andere inkomen de lasten dragen.', overlijden: 'Valt een inkomen weg, dan moet het andere inkomen de lasten dragen.',
  scheiding: 'Blijft één van jullie in het huis wonen, dan moet die de hypotheek alleen kunnen betalen.',
  daling: 'Bijvoorbeeld als je minder gaat werken of een lager betaalde baan neemt.'
};
function tip(s, k) {
  const t = {
    rente: 'Begin 1 tot 2 jaar vooraf met oriënteren. Rentemiddeling of extra aflossen kan de klap verzachten.',
    aftrek: 'Extra aflossen vóór het einde van de aftrek verlaagt je netto lasten daarna.',
    pensioen: 'Check je pensioen op mijnpensioenoverzicht.nl en kijk of aflossen vóór je pensioen verstandig is.',
    samenloop: 'Bespreek dit tijdig met je adviseur: één plan voor rente, aflossen en pensioen werkt het best.',
    looptijd: 'Maak een aflosplan of spaar voor het aflossingsvrije deel, zodat je niet afhankelijk bent van oversluiten op latere leeftijd.',
    ww1: 'Een buffer van 3 tot 6 maanden woonlasten geeft rust. Een woonlastenverzekering kan helpen.',
    ao1: 'Vraag je werkgever naar een WIA-hiaatverzekering, of overweeg een arbeidsongeschiktheids- of woonlastenverzekering.',
    overlijden: 'Controleer of je overlijdensrisicoverzekering en nabestaandenpensioen genoeg zijn.',
    scheiding: 'Leg afspraken vast, bijvoorbeeld in een samenlevingscontract, en weet wat er met de hypotheek gebeurt.',
    daling: 'Breng je vaste lasten in kaart en kijk welke ruimte je hebt.'
  };
  const id = s.id === 'ww2' ? 'ww1' : s.id === 'overlijden1' ? 'overlijden' : s.id;
  let x = t[id] || '';
  if (k.nhg === 'ja' && ['ww1', 'ao1', 'overlijden', 'scheiding', 'daling'].includes(id)) x += ' Je hebt NHG: neem bij betalingsproblemen tijdig contact op met je geldverstrekker.';
  return x;
}
function zin(c) {
  return c >= 7 ? 'Je hypotheek is ruim betaalbaar.' : c >= 5.5 ? 'Je hypotheek is betaalbaar, maar let op de momenten hieronder.' : c >= 4 ? 'Je hypotheek kan krap worden. Het loont om nu al actie te ondernemen.' : 'Je hypotheek kan in de knel komen. Bespreek dit met je adviseur.';
}

function tijdlijn(res) {
  const pts = res.scen.filter(s => s.groep === 'moment' && /^\d{4}/.test(s.wanneer));
  if (!pts.length) return '';
  const y0 = J, y1 = Math.max(y0 + 10, ...pts.map(s => +s.wanneer.slice(-4))) + 1, pos = y => ((y - y0) / (y1 - y0) * 100).toFixed(1) + '%';
  const tk = []; for (let y = y0; y <= y1; y += Math.ceil((y1 - y0) / 5)) tk.push(y);
  return `<div class="tl"><div class="ax"></div>${tk.map(y => `<span class="y" style="left:${pos(y)}">${y}</span>`).join('')}
    ${pts.map(s => `<span class="m" style="left:${pos(+s.wanneer.slice(0, 4))}" title="${esc(s.titel)}"><i style="background:var(--${kleur(s.cijfer)})"></i></span>`).join('')}</div>
    <p class="disc" style="text-align:center;margin:0">Belangrijke momenten in de tijd, gekleurd naar cijfer</p>`;
}

function kaart(s, k) {
  const ruimte = isFinite(s.ruimte) ? s.ruimte : -Infinity;
  return `<div class="s"><div style="display:flex;gap:8px;align-items:flex-start"><div style="flex:1"><div class="t">${esc(s.titel)}</div><div class="w">${esc(s.wanneer)}</div></div><span class="c ${kleur(s.cijfer)}">${fmtNum(s.cijfer)}</span></div>
    <p style="font-size:14px;margin:8px 0 0">${UITLEG[s.id] || ''}</p>
    <div class="n"><span>Netto per maand</span><b style="color:var(--ink)">${fmtEUR(s.netto)}</b></div>
    ${s.id !== 'huidig' ? `<div class="n"><span>Verschil met nu</span><span>${s.deltaNetto >= 0 ? '+' : ''}${fmtEUR(s.deltaNetto)}</span></div>` : ''}
    <div class="n"><span>${ruimte >= 0 ? 'Ruimte' : 'Tekort'} volgens leennorm</span><b style="color:var(--${ruimte >= 0 ? 'goed' : 'risico'})">${isFinite(ruimte) ? fmtEUR(Math.abs(ruimte)) : 'geen inkomen'}</b></div>
    ${s.cijfer < 7 && s.id !== 'huidig' ? `<div class="tip"><b>Wat kun je doen?</b> ${tip(s, k)}</div>` : ''}</div>`;
}

function renderResultaat(app) {
  const k = naarDossier(), res = berekenDossier(k), nu = res.scen[0];
  const mom = res.scen.filter(s => s.groep === 'moment'), ev = res.scen.filter(s => s.groep === 'event');
  const zwak = res.scen.filter(s => s.id !== 'huidig').sort((a, b) => a.cijfer - b.cijfer)[0];
  ST.res = res; ST.dossier = k;
  app.innerHTML = `
  <div class="steps">${STAPPEN.map(() => '<span class="on"></span>').join('')}</div>
  <div class="card">
    <div class="score"><div class="ring ${kleur(res.totaal)}"><b>${fmtNum(res.totaal)}</b><small>${label(res.totaal)}</small></div>
      <div style="flex:1;min-width:240px"><div class="muted" style="font-size:14px">Jouw hypotheekcijfer${k.naam1 ? ', ' + esc(k.naam1) : ''}</div>
        <h2 style="margin:2px 0 8px">${zin(res.totaal)}</h2>
        <div class="kv"><span>Cijfer nu</span><span>${fmtNum(nu.cijfer)}</span>
          <span>Netto maandlast nu</span><span>${fmtEUR(nu.netto)}</span>
          <span>Maximale hypotheek volgens leennorm ${PARAMS.normJaar}</span><span>${fmtEUR(nu.maxH)}</span>
          ${zwak ? `<span>Waar het het meest knelt</span><span>${esc(zwak.titel)} (${fmtNum(zwak.cijfer)})</span>` : ''}</div></div></div>
    ${tijdlijn(res)}
  </div>
  <div class="card"><h2>Belangrijke momenten</h2><p class="lead">Momenten die zeker komen. Hier kun je je goed op voorbereiden.</p>
    <div class="sc">${mom.map(s => kaart(s, k)).join('') || '<p class="muted">Er vallen geen belangrijke momenten binnen de looptijd van je hypotheek.</p>'}</div></div>
  <div class="card"><h2>Als het tegenzit</h2><p class="lead">Life events die je niet kunt plannen. Hoe sta je ervoor als het toch gebeurt?</p>
    <div class="sc">${ev.map(s => kaart(s, k)).join('')}</div></div>
  <div class="card"><h2>Je woning</h2>
    <div class="kv"><span>Woningwaarde (jouw schatting)</span><span>${fmtEUR(k.waarde)}</span>
      <span>Hypotheek ten opzichte van woningwaarde</span><span>${res.ltv != null ? fmtPct(res.ltv * 100, 0) : '–'}</span>
      <span>Funderingscijfer (indicatief)</span><span><span class="c ${res.fund.niveau === 'hoog' ? 'risico' : res.fund.niveau === 'middel' ? 'krap' : 'goed'}" style="height:24px;min-width:36px;font-size:13px">${fmtNum(res.fund.cijfer)}</span></span></div>
    ${res.fund.niveau !== 'laag' ? `<div class="hint">Je woning heeft kenmerken die wijzen op een verhoogd funderingsrisico (${esc(res.fund.redenen.join(', '))}). Een funderingsonderzoek geeft duidelijkheid; tijdig onderzoek voorkomt hogere kosten.</div>` : ''}
    ${res.ltv > 1 ? '<div class="hint">Je hypotheek is hoger dan de geschatte waarde van je woning. Extra aflossen verkleint dit risico.</div>' : ''}
  </div>
  <div class="card"><h2>Hoe nu verder?</h2>
    <p>Je cijfer is een momentopname. Bespreek de uitkomst met je hypotheekadviseur: die kan met je meekijken naar extra aflossen, rentemiddeling, verzekeringen of een andere hypotheekvorm.</p>
    <div class="nav" style="justify-content:flex-start"><button class="btn a" id="pdf">Download rapport (PDF)</button><button class="btn" id="aanp">Gegevens aanpassen</button><button class="btn" id="opn">Opnieuw beginnen</button></div>
    <details style="margin-top:16px"><summary>Hoe berekenen we je cijfer?</summary>
      <p class="disc">Per situatie berekenen we hoeveel hypotheek volgens de leennormen ${PARAMS.normJaar} (Tijdelijke regeling hypothecair krediet) bij je inkomen past, en vergelijken dat met je hypotheek op dat moment. Precies op de norm geeft een 6; ruim eronder een hoger cijfer, erboven een lager cijfer. Je totaalcijfer is het gemiddelde van je cijfer nu, je laagste cijfer bij een belangrijk moment en je laagste cijfer bij een life event.
      We gaan uit van vereenvoudigingen: AOW-leeftijd 67, WW/WIA ongeveer 70% van je loon, pensioen 70% van je inkomen als je niets invult, rente na de rentevaste periode ${fmtPct(+k.renteHerfin || PARAMS.renteHerfinDefault)}. Studieschuld en andere leningen tellen niet mee. Netto lasten zijn indicatief (fiscale regels ${PARAMS.jaar}).</p></details>
    <p class="disc">Dit is een indicatie en geen hypotheekadvies of kredietbeslissing. Aan de uitkomst kun je geen rechten ontlenen.</p>
  </div>`;
  app.querySelector('#pdf').onclick = () => printRapport(k, res);
  app.querySelector('#aanp').onclick = () => { ST.stap = 0; render(); window.scrollTo(0, 0); };
  app.querySelector('#opn').onclick = () => { if (confirm('Alle ingevulde gegevens wissen?')) location.reload(); };
}

function printRapport(k, res) {
  const w = window.open('', '_blank'); if (!w) { alert('Sta pop-ups toe om het rapport te openen.'); return; }
  const row = s => `<tr><td><b>${esc(s.titel)}</b><div class="n">${UITLEG[s.id] || ''}</div></td><td>${esc(s.wanneer)}</td><td class="r">${fmtEUR(s.netto)}</td><td><span class="c ${kleur(s.cijfer)}">${fmtNum(s.cijfer)}</span></td><td>${s.cijfer < 7 && s.id !== 'huidig' ? tip(s, k) : '–'}</td></tr>`;
  w.document.write(`<!doctype html><html lang="nl"><head><meta charset="utf-8"><title>Mijn hypotheekcijfer</title><style>
  body{font:12px/1.5 system-ui,Segoe UI,Arial,sans-serif;color:#13203b;margin:28px}h1{font-size:22px;margin:0}h2{font-size:14px;color:#1d3a8a;border-bottom:1px solid #dde;padding-bottom:3px;margin:18px 0 6px}
  table{width:100%;border-collapse:collapse}td,th{padding:5px 6px;border-bottom:1px solid #e3e6ee;text-align:left;vertical-align:top}th{font-size:10px;text-transform:uppercase;color:#5d6680}.r{text-align:right}.n{color:#5d6680;font-size:11px}
  .c{display:inline-block;min-width:30px;text-align:center;border-radius:4px;font-weight:700;padding:1px 4px}.goed{background:#e2f4ea;color:#17824f}.let{background:#eef4d9;color:#5f7417}.krap{background:#fdefd8;color:#a96400}.risico{background:#fbe4e1;color:#bf2f24}@page{margin:14mm}</style></head><body>
  <table><tr><td style="border:0"><h1>Mijn hypotheekcijfer</h1><b>Scoor je hypotheekcijfer, en zie hoe jij ervoor staat.</b><div class="n">${new Date().toLocaleDateString('nl-NL', { day: 'numeric', month: 'long', year: 'numeric' })} · leennormen ${PARAMS.normJaar}</div></td>
  <td style="border:0;text-align:right"><span class="c ${kleur(res.totaal)}" style="font-size:28px;padding:6px 14px">${fmtNum(res.totaal)}</span><div class="n">${label(res.totaal)}</div></td></tr></table>
  <p>${zin(res.totaal)} Je netto maandlast is nu ${fmtEUR(res.scen[0].netto)}.</p>
  <h2>Cijfer per moment en life event</h2><table><tr><th>Situatie</th><th>Wanneer</th><th class="r">Netto p/m</th><th>Cijfer</th><th>Wat kun je doen?</th></tr>${res.scen.map(row).join('')}</table>
  <h2>Je woning</h2><table><tr><td>Woningwaarde (eigen schatting)</td><td class="r">${fmtEUR(k.waarde)}</td></tr><tr><td>Hypotheek / woningwaarde</td><td class="r">${fmtPct(res.ltv * 100, 0)}</td></tr><tr><td>Funderingscijfer (indicatief)</td><td class="r">${fmtNum(res.fund.cijfer)}</td></tr></table>
  <p class="n" style="margin-top:16px">Dit rapport is een indicatie en geen hypotheekadvies of kredietbeslissing. Berekend met de leennormen ${PARAMS.normJaar} (Tijdelijke regeling hypothecair krediet) en vereenvoudigde aannames. Bespreek de uitkomst met je hypotheekadviseur.</p></body></html>`);
  w.document.close(); w.focus(); setTimeout(() => w.print(), 400);
}

render();
</script>
</body>
</html>
